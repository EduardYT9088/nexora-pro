<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120F2A">
<title>Nexora Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2FA; --surface:#FFFFFF; --surface2:#E9E7F5; --text:#17142E; --muted:#6B6888;
  --line:rgba(23,20,46,.08); --accent:#6C4CF5; --accent2:#12B5CB; --onaccent:#fff; --danger:#E0465C;
  --scrim:rgba(10,8,25,.45);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#120F2A; --surface:#1C1838; --surface2:#262148; --text:#F1EFFF; --muted:#9A95C2;
    --line:rgba(255,255,255,.07); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120F2A; --surface:#1C1838; --surface2:#262148; --text:#F1EFFF; --muted:#9A95C2;
  --line:rgba(255,255,255,.07); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{display:block}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative}
