      - name: Versión automática y novedades
        id: ver
        env:
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          run = int(os.environ['RUN'])
          ver = '1.7.' + str(run)
          code = 20000 + run
          lines = []
          try:
              lines = [l.strip() for l in open('novedades.md', encoding='utf-8-sig').read().splitlines()]
          except Exception:
              pass
          opcional = any(l.lower().startswith('[opcional]') for l in lines)
          import re as _re
          for l in lines:
              m = _re.match('^(?:versi[oó]n|version)[ :]*[vV]?([0-9]+[.][0-9]+(?:[.][0-9]+)?)', l, _re.I)
              if m:
                  ver = m.group(1)
                  break
          nov = [l[1:].strip() for l in lines if l.startswith('-') and l[1:].strip()]
          g = open('proyecto/app/build.gradle.kts', encoding='utf-8').read()
          import re
          g = re.sub('versionCode = [0-9]+', 'versionCode = ' + str(code), g)
          g = re.sub('versionName = "[^"]*"', 'versionName = "' + ver + '"', g)
          open('proyecto/app/build.gradle.kts', 'w', encoding='utf-8').write(g)
          info = {'version': ver, 'code': code, 'obligatoria': not opcional, 'novedades': nov,
                  'apk': 'https://github.com/' + os.environ['REPO'] + '/releases/latest/download/NexoraPro.apk'}
          json.dump(info, open('version-release.json', 'w', encoding='utf-8'), ensure_ascii=False)
          NL = chr(10)
          notes = 'Nexora Pro v' + ver + NL + NL + ''.join('- ' + x + NL for x in nov) + NL + 'Descarga NexoraPro.apk e instálalo en tu teléfono.'
          open('release-notes.md', 'w', encoding='utf-8').write(notes)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('version=' + ver + chr(10))
          print('Versión', ver, 'código', code, 'obligatoria', not opcional)
          PY

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp proyecto/app/build/outputs/apk/release/app-release.apk NexoraPro.apk

      - name: Guardar APK en la compilación
        uses: actions/upload-artifact@v4
        with:
          name: NexoraPro-apk
          path: NexoraPro.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          TAG="v$VER"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then TAG="v$VER-build${{ github.run_number }}"; fi
          cp version-release.json version.json
          gh release create "$TAG" NexoraPro.apk version.json \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "Nexora Pro v$VER" \
            --notes-file release-notes.md \
            --latest
