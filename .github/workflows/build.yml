name: Construir APK de Nexora Pro

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Crear el proyecto Android
        shell: bash
        run: |
          set -e
          mkdir -p proyecto && cd proyecto
          cat > settings.gradle.kts <<'NXEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NexoraPro"
          include(":app")
          NXEOF
          cat > build.gradle.kts <<'NXEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          NXEOF
          cat > gradle.properties <<'NXEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          NXEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'NXEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.nexora.pro"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.nexora.pro"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 20000
                  versionName = "1.7.0"
              }

              signingConfigs {
                  create("nexora") {
                      storeFile = file("nexora.jks")
                      storePassword = "nexora123"
                      keyAlias = "nexora"
                      keyPassword = "nexora123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      // Firma fija: permite actualizar la app sin desinstalarla.
                      signingConfig = signingConfigs.getByName("nexora")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          NXEOF
          cat > app/proguard-rules.pro <<'NXEOF'
          # Métodos que la interfaz llama desde JavaScript
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes JavascriptInterface
          NXEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'NXEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Leer la música y los videos del teléfono -->
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
              <!-- Controles en la notificación y música en segundo plano -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <!-- Necesario para el servidor local 127.0.0.1 que entrega la música al reproductor; la app no usa internet -->
              <uses-permission android:name="android.permission.INTERNET" />
              <!-- Instalar las actualizaciones de Nexora Pro dentro de la app (Android siempre pide confirmar) -->
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Nexora"
                  android:hardwareAccelerated="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Abrir canciones y videos desde otras apps (Nexora Download, exploradores de archivos…) -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="audio/*" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".InstallResultReceiver"
                      android:exported="false" />

                  <service
                      android:name=".PlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          NXEOF
          mkdir -p app/src/main/java/com/nexora/pro
          cat > app/src/main/java/com/nexora/pro/FileActions.kt <<'NXEOF'
          package com.nexora.pro

          import android.app.Activity
          import android.app.RecoverableSecurityException
          import android.content.ContentUris
          import android.content.ContentValues
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import org.json.JSONArray

          /** Compartir, mover a la papelera y renombrar archivos de música y video del teléfono. */
          class FileActions(private val act: Activity, private val js: (String) -> Unit) {

              companion object {
                  const val REQ_TRASH = 21
                  const val REQ_RENAME = 22
                  const val REQ_RESTORE = 23
                  const val REQ_DELETE_FOREVER = 24
              }

              /** Lista lo que está en la papelera del teléfono (Android 11+). */
              fun listTrash(): String {
                  val out = JSONArray()
                  if (Build.VERSION.SDK_INT < 30) return out.toString()
                  for ((type, base) in listOf("audio" to MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                                               "video" to MediaStore.Video.Media.EXTERNAL_CONTENT_URI)) {
                      val args = android.os.Bundle().apply {
                          putInt(MediaStore.QUERY_ARG_MATCH_TRASHED, MediaStore.MATCH_ONLY)
                          putString(android.content.ContentResolver.QUERY_ARG_SQL_SORT_ORDER,
                              "${MediaStore.MediaColumns.DATE_EXPIRES} ASC")
                      }
                      val cols = arrayOf(android.provider.BaseColumns._ID, MediaStore.MediaColumns.DISPLAY_NAME,
                          MediaStore.MediaColumns.TITLE, MediaStore.MediaColumns.DURATION,
                          MediaStore.MediaColumns.DATE_EXPIRES, MediaStore.MediaColumns.SIZE,
                          MediaStore.MediaColumns.BUCKET_DISPLAY_NAME)
                      runCatching {
                          act.contentResolver.query(base, cols, args, null)?.use { c ->
                              while (c.moveToNext()) {
                                  out.put(org.json.JSONObject().apply {
                                      put("type", type)
                                      put("id", c.getLong(0))
                                      put("name", c.getString(1) ?: "")
                                      put("title", c.getString(2) ?: "")
                                      put("duration", c.getLong(3))
                                      put("expires", c.getLong(4))
                                      put("size", c.getLong(5))
                                      put("folder", c.getString(6) ?: "")
                                  })
                              }
                          }
                      }
                  }
                  return out.toString()
              }

              fun restore(json: String) = trashRequest(json, false, REQ_RESTORE, "restore")

              fun deleteForever(json: String) {
                  val uris = parse(json).map { it.second }
                  if (uris.isEmpty() || Build.VERSION.SDK_INT < 30) { js("window.nxOnTrashAction && nxOnTrashAction('delete', false)"); return }
                  try {
                      val pi = MediaStore.createDeleteRequest(act.contentResolver, uris)
                      @Suppress("DEPRECATION")
                      act.startIntentSenderForResult(pi.intentSender, REQ_DELETE_FOREVER, null, 0, 0, 0)
                  } catch (e: Exception) { js("window.nxOnTrashAction && nxOnTrashAction('delete', false)") }
              }

              private fun trashRequest(json: String, value: Boolean, req: Int, kind: String) {
                  val uris = parse(json).map { it.second }
                  if (uris.isEmpty() || Build.VERSION.SDK_INT < 30) { js("window.nxOnTrashAction && nxOnTrashAction('$kind', false)"); return }
                  try {
                      val pi = MediaStore.createTrashRequest(act.contentResolver, uris, value)
                      @Suppress("DEPRECATION")
                      act.startIntentSenderForResult(pi.intentSender, req, null, 0, 0, 0)
                  } catch (e: Exception) { js("window.nxOnTrashAction && nxOnTrashAction('$kind', false)") }
              }

              private var pendingRename: Triple<Uri, String, String>? = null  // uri, nombre, tipo

              fun uriOf(type: String, id: Long): Uri = ContentUris.withAppendedId(
                  if (type == "video") MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  else MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)

              private fun parse(json: String): List<Pair<String, Uri>> {
                  val arr = JSONArray(json)
                  return (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      val type = o.getString("type")
                      type to uriOf(type, o.getLong("id"))
                  }
              }

              fun share(json: String) {
                  val items = parse(json)
                  if (items.isEmpty()) return
                  val uris = ArrayList(items.map { it.second })
                  val allVideo = items.all { it.first == "video" }
                  val allAudio = items.all { it.first == "audio" }
                  val mime = when { allVideo -> "video/*"; allAudio -> "audio/*"; else -> "*/*" }
                  val send = if (uris.size == 1) Intent(Intent.ACTION_SEND).putExtra(Intent.EXTRA_STREAM, uris[0])
                             else Intent(Intent.ACTION_SEND_MULTIPLE).putParcelableArrayListExtra(Intent.EXTRA_STREAM, uris)
                  send.type = mime
                  send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  runCatching { act.startActivity(Intent.createChooser(send, "Compartir")) }
                      .onFailure { js("window.nxToast && nxToast('No se pudo compartir')") }
              }

              fun trash(json: String) {
                  val uris = parse(json).map { it.second }
                  if (uris.isEmpty()) return
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          val pi = MediaStore.createTrashRequest(act.contentResolver, uris, true)
                          @Suppress("DEPRECATION")
                          act.startIntentSenderForResult(pi.intentSender, REQ_TRASH, null, 0, 0, 0)
                      } else {
                          var ok = true
                          for (u in uris) {
                              try { act.contentResolver.delete(u, null, null) }
                              catch (e: RecoverableSecurityException) {
                                  @Suppress("DEPRECATION")
                                  act.startIntentSenderForResult(e.userAction.actionIntent.intentSender, REQ_TRASH, null, 0, 0, 0)
                                  return
                              }
                              catch (e: Exception) { ok = false }
                          }
                          js("window.nxOnTrash && nxOnTrash($ok)")
                      }
                  } catch (e: Exception) {
                      js("window.nxOnTrash && nxOnTrash(false)")
                  }
              }

              fun rename(type: String, id: Long, newName: String) {
                  val uri = uriOf(type, id)
                  pendingRename = Triple(uri, newName, type)
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          val pi = MediaStore.createWriteRequest(act.contentResolver, listOf(uri))
                          @Suppress("DEPRECATION")
                          act.startIntentSenderForResult(pi.intentSender, REQ_RENAME, null, 0, 0, 0)
                      } else {
                          try { doRename() }
                          catch (e: RecoverableSecurityException) {
                              @Suppress("DEPRECATION")
                              act.startIntentSenderForResult(e.userAction.actionIntent.intentSender, REQ_RENAME, null, 0, 0, 0)
                          }
                      }
                  } catch (e: Exception) {
                      pendingRename = null
                      js("window.nxOnRename && nxOnRename(false)")
                  }
              }

              private fun doRename() {
                  val (uri, name, type) = pendingRename ?: return
                  // Conserva la extensión original del archivo.
                  val oldName = act.contentResolver.query(uri, arrayOf(MediaStore.MediaColumns.DISPLAY_NAME), null, null, null)
                      ?.use { if (it.moveToFirst()) it.getString(0) else null } ?: ""
                  val ext = oldName.substringAfterLast('.', "")
                  val clean = name.replace(Regex("[\\\\/:*?\"<>|]"), "").trim()
                  val display = if (ext.isNotEmpty() && !clean.endsWith(".$ext", true)) "$clean.$ext" else clean
                  val v = ContentValues().apply { put(MediaStore.MediaColumns.DISPLAY_NAME, display) }
                  act.contentResolver.update(uri, v, null, null)
                  if (type == "audio") runCatching {
                      act.contentResolver.update(uri, ContentValues().apply { put(MediaStore.MediaColumns.TITLE, clean) }, null, null)
                  }
                  pendingRename = null
                  js("window.nxOnRename && nxOnRename(true)")
              }

              /** Devuelve true si el resultado era de una de estas acciones. */
              fun onResult(requestCode: Int, resultCode: Int): Boolean {
                  when (requestCode) {
                      REQ_TRASH -> js("window.nxOnTrash && nxOnTrash(${resultCode == Activity.RESULT_OK})")
                      REQ_RESTORE -> js("window.nxOnTrashAction && nxOnTrashAction('restore', ${resultCode == Activity.RESULT_OK})")
                      REQ_DELETE_FOREVER -> js("window.nxOnTrashAction && nxOnTrashAction('delete', ${resultCode == Activity.RESULT_OK})")
                      REQ_RENAME -> {
                          if (resultCode == Activity.RESULT_OK) {
                              try { doRename() } catch (e: Exception) {
                                  pendingRename = null; js("window.nxOnRename && nxOnRename(false)")
                              }
                          } else { pendingRename = null; js("window.nxOnRename && nxOnRename(false)") }
                      }
                      else -> return false
                  }
                  return true
              }
          }
          NXEOF
          cat > app/src/main/java/com/nexora/pro/LocalServer.kt <<'NXEOF'
          package com.nexora.pro

          import android.content.ContentUris
          import android.content.Context
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.ParcelFileDescriptor
          import android.provider.MediaStore
          import android.util.LruCache
          import android.util.Size
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream
          import java.io.InputStream

          /**
           * Sirve la interfaz (assets), los archivos de música/video del teléfono y sus portadas
           * desde https://appassets.androidplatform.net, con soporte de rangos para poder adelantar.
           */
          class LocalServer(private val ctx: Context) {

              private val thumbs = object : LruCache<String, ByteArray>(16 * 1024 * 1024) {
                  override fun sizeOf(key: String, value: ByteArray) = value.size
              }

              fun handle(req: WebResourceRequest): WebResourceResponse? {
                  val path = req.url.path ?: return notFound()
                  return try {
                      when {
                          path.startsWith("/assets/") -> asset(path.removePrefix("/assets/"))
                          path.startsWith("/media/") -> media(path, req.requestHeaders)
                          path.startsWith("/thumb/") -> thumb(path, req.url.getQueryParameter("s"))
                          else -> notFound()
                      }
                  } catch (e: Exception) {
                      notFound()
                  }
              }

              private fun contentUri(path: String): Pair<Uri, String> {
                  val parts = path.trim('/').split('/')
                  val type = parts[1]
                  val id = parts[2].toLong()
                  val base = if (type == "video") MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                             else MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  return ContentUris.withAppendedId(base, id) to type
              }

              private fun asset(name: String): WebResourceResponse {
                  val mime = when (name.substringAfterLast('.', "").lowercase()) {
                      "html" -> "text/html"
                      "js" -> "application/javascript"
                      "css" -> "text/css"
                      "svg" -> "image/svg+xml"
                      "png" -> "image/png"
                      "json" -> "application/json"
                      else -> "application/octet-stream"
                  }
                  return WebResourceResponse(mime, "utf-8", ctx.assets.open(name))
              }

              private fun media(path: String, reqHeaders: Map<String, String>?): WebResourceResponse {
                  val (uri, type) = contentUri(path)
                  val pfd = ctx.contentResolver.openFileDescriptor(uri, "r") ?: return notFound()
                  val total = pfd.statSize
                  val mime = ctx.contentResolver.getType(uri) ?: if (type == "video") "video/mp4" else "audio/mpeg"
                  val input = ParcelFileDescriptor.AutoCloseInputStream(pfd)
                  val headers = mutableMapOf(
                      "Accept-Ranges" to "bytes",
                      "Access-Control-Allow-Origin" to "*",
                      "Cache-Control" to "no-store"
                  )
                  val range = reqHeaders?.entries?.firstOrNull { it.key.equals("Range", ignoreCase = true) }?.value
                  if (range != null && total > 0) {
                      val m = Regex("bytes=(\\d*)-(\\d*)").find(range)
                      val a = m?.groupValues?.get(1).orEmpty()
                      val b = m?.groupValues?.get(2).orEmpty()
                      var start: Long
                      var end: Long
                      if (a.isEmpty() && b.isNotEmpty()) {
                          start = maxOf(0L, total - b.toLong()); end = total - 1
                      } else {
                          start = a.toLongOrNull() ?: 0L
                          end = b.toLongOrNull() ?: (total - 1)
                      }
                      end = minOf(end, total - 1)
                      if (start >= total || start > end) {
                          input.close()
                          headers["Content-Range"] = "bytes */$total"
                          return WebResourceResponse(mime, null, 416, "Range Not Satisfiable", headers, ByteArrayInputStream(ByteArray(0)))
                      }
                      var skipped = 0L
                      while (skipped < start) {
                          val s = input.skip(start - skipped)
                          if (s <= 0) break
                          skipped += s
                      }
                      val len = end - start + 1
                      headers["Content-Range"] = "bytes $start-$end/$total"
                      headers["Content-Length"] = len.toString()
                      return WebResourceResponse(mime, null, 206, "Partial Content", headers, LimitedInputStream(input, len))
                  }
                  if (total > 0) headers["Content-Length"] = total.toString()
                  return WebResourceResponse(mime, null, 200, "OK", headers, input)
              }

              private fun thumb(path: String, sizeParam: String?): WebResourceResponse {
                  val px = sizeParam?.toIntOrNull()?.coerceIn(96, 1024) ?: 320
                  val key = "$path@$px"
                  val bytes = thumbs.get(key) ?: run {
                      val (uri, type) = contentUri(path)
                      val bmp = try {
                          ctx.contentResolver.loadThumbnail(uri, Size(px, px), null)
                      } catch (e: Exception) {
                          if (type != "audio") throw e
                          // Algunas canciones (m4a, opus…) guardan la portada de otra forma: la leemos directo del archivo.
                          val mmr = android.media.MediaMetadataRetriever()
                          try {
                              mmr.setDataSource(ctx, uri)
                              val pic = mmr.embeddedPicture ?: throw e
                              val opts = android.graphics.BitmapFactory.Options().apply { inJustDecodeBounds = true }
                              android.graphics.BitmapFactory.decodeByteArray(pic, 0, pic.size, opts)
                              var sample = 1
                              while (opts.outWidth / (sample * 2) >= px && opts.outHeight / (sample * 2) >= px) sample *= 2
                              android.graphics.BitmapFactory.decodeByteArray(pic, 0, pic.size,
                                  android.graphics.BitmapFactory.Options().apply { inSampleSize = sample }) ?: throw e
                          } finally { runCatching { mmr.release() } }
                      }
                      val out = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.JPEG, 84, out)
                      bmp.recycle()
                      out.toByteArray().also { thumbs.put(key, it) }
                  }
                  return WebResourceResponse("image/jpeg", null, 200, "OK",
                      mapOf("Cache-Control" to "max-age=86400"), ByteArrayInputStream(bytes))
              }

              private fun notFound() =
                  WebResourceResponse("text/plain", "utf-8", 404, "Not Found", emptyMap(), ByteArrayInputStream(ByteArray(0)))
          }

          class LimitedInputStream(private val inner: InputStream, private var left: Long) : InputStream() {
              override fun read(): Int {
                  if (left <= 0) return -1
                  val r = inner.read()
                  if (r >= 0) left--
                  return r
              }

              override fun read(b: ByteArray, off: Int, len: Int): Int {
                  if (left <= 0) return -1
                  val n = inner.read(b, off, minOf(len.toLong(), left).toInt())
                  if (n > 0) left -= n
                  return n
              }

              override fun available(): Int = minOf(inner.available().toLong(), left).toInt()
              override fun close() = inner.close()
          }
          NXEOF
          cat > app/src/main/java/com/nexora/pro/MainActivity.kt <<'NXEOF'
          package com.nexora.pro

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import org.json.JSONObject

          class MainActivity : Activity() {

              companion object {
                  const val HOST = "appassets.androidplatform.net"
                  const val START_URL = "https://$HOST/assets/index.html"
                  private const val REQ_FILES = 10
                  private const val REQ_MEDIA = 11
                  private const val REQ_NOTIF = 12
                  private const val PERM_VISUAL_SELECTED = "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
              }

              private lateinit var root: FrameLayout
              private lateinit var webView: WebView
              private lateinit var server: LocalServer
              private lateinit var files: FileActions
              private lateinit var nat: NativeAudioPlayer

              @Volatile private var boostLevel = 100
              @Volatile private var boostKeys = true
              private var pipPlaying = true
              private var pipW = 16
              private var pipH = 9
              private val pipReceiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(c: android.content.Context?, i: Intent?) {
                      val a = i?.getStringExtra("a") ?: return
                      js("window.nxPipAction && nxPipAction('$a')")
                  }
              }

              /** Ventana flotante con botones propios de Nexora: −10 s, reproducir/pausa y +10 s. */
              private fun pipParams(w: Int, h: Int): android.app.PictureInPictureParams {
                  var rw = if (w > 0) w else 16; var rh = if (h > 0) h else 9
                  val r = rw.toDouble() / rh
                  if (r > 2.39) { rw = 239; rh = 100 } else if (r < 1 / 2.39) { rw = 100; rh = 239 }
                  fun act(icon: Int, label: String, a: String, code: Int): android.app.RemoteAction {
                      val pi = android.app.PendingIntent.getBroadcast(this, code,
                          Intent("com.nexora.pro.PIP").setPackage(packageName).putExtra("a", a),
                          android.app.PendingIntent.FLAG_IMMUTABLE or android.app.PendingIntent.FLAG_UPDATE_CURRENT)
                      return android.app.RemoteAction(android.graphics.drawable.Icon.createWithResource(this, icon), label, label, pi)
                  }
                  val actions = listOf(
                      act(R.drawable.ic_n_rew10, "Atrás 10 s", "rew", 31),
                      if (pipPlaying) act(R.drawable.ic_n_pause, "Pausar", "toggle", 32) else act(R.drawable.ic_n_play, "Reproducir", "toggle", 33),
                      act(R.drawable.ic_n_fwd10, "Adelante 10 s", "fwd", 34))
                  return android.app.PictureInPictureParams.Builder()
                      .setAspectRatio(android.util.Rational(rw, rh))
                      .setActions(actions).build()
              }

              private var pendingExternal: String? = null
              private var pageReady = false
              private var resumedNow = false
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var customView: View? = null
              private var customViewCallback: WebChromeClient.CustomViewCallback? = null

              @SuppressLint("SetJavaScriptEnabled", "JavascriptInterface")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  server = LocalServer(applicationContext)
