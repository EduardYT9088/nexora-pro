                      root.performHapticFeedback(android.view.HapticFeedbackConstants.LONG_PRESS)
                  }

                  @JavascriptInterface
                  fun listTrash() { Thread { val j = files.listTrash(); js("window.nxOnTrashList && nxOnTrashList($j)") }.start() }

                  @JavascriptInterface
                  fun restore(json: String) = runOnUiThread { files.restore(json) }

                  @JavascriptInterface
                  fun deleteForever(json: String) = runOnUiThread { files.deleteForever(json) }

                  /** Nivel del amplificador (100–300) y si los botones de volumen pueden subirlo. */
                  @JavascriptInterface
                  fun setBoost(level: Int, keysEnabled: Boolean) { boostLevel = level; boostKeys = keysEnabled }

                  // Reproductor nativo (modo "junto con otras aplicaciones")
                  @JavascriptInterface fun naLoad(url: String) = runOnUiThread { nat.load(url) }
                  @JavascriptInterface fun naPlay() = runOnUiThread { nat.play() }
                  @JavascriptInterface fun naPause() = runOnUiThread { nat.pause() }
                  @JavascriptInterface fun naStop() = runOnUiThread { nat.release() }
                  @JavascriptInterface fun naSeek(ms: Long) = runOnUiThread { nat.seek(ms) }
                  @JavascriptInterface fun naRate(r: Double) = runOnUiThread { nat.setRate(r) }
                  @JavascriptInterface fun naVolume(v: Double) = runOnUiThread { nat.setVolume(v) }
                  @JavascriptInterface fun naEq(on: Boolean, gains: String) = runOnUiThread { nat.setEq(on, gains) }
                  // Aviso en la barra de estado cuando llega música o video nuevo (lo envía Android aunque la app esté cerrada)
                  @JavascriptInterface fun testNewNotif() = NewMedia.test(applicationContext)
                  @JavascriptInterface fun testMusicTime() = MusicTime.test(applicationContext)
                  @JavascriptInterface fun setMusicTime(on: Boolean, json: String) { MusicTime.configure(applicationContext, on, json); MusicTime.schedule(applicationContext) }
                  @JavascriptInterface fun setNewNotif(on: Boolean, json: String, names: Boolean) {
                      NewMedia.configure(applicationContext, on, json, names)
                      NewMedia.schedule(applicationContext)
                      NewMedia.periodic(applicationContext)
                      NewMedia.watch(applicationContext)
                  }
                  @JavascriptInterface fun setNewWatch(on: Boolean) {
                      NewMedia.setWatch(applicationContext, on)
                      NewMedia.watch(applicationContext)
                  }
                  // Visualizador de música: datos reales del sonido (necesita el permiso de audio, solo para medir; no graba)
                  @JavascriptInterface fun naViz(on: Boolean) = runOnUiThread {
                      if (on && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          nat.setViz(true)
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), REQ_REC)
                      } else nat.setViz(on)
                  }
                  @JavascriptInterface fun naBoost(level: Int) = runOnUiThread { nat.setBoost(level) }
                  @JavascriptInterface fun naFx(bass: Int, surround: Int, clarity: Int, norm: Boolean) = runOnUiThread { nat.setFx(bass, surround, clarity, norm) }

                  @JavascriptInterface
                  fun version(): String = runCatching { packageManager.getPackageInfo(packageName, 0).versionName }.getOrNull() ?: ""

                  @JavascriptInterface
                  fun versionCode(): Long = runCatching { packageManager.getPackageInfo(packageName, 0).longVersionCode }.getOrDefault(0L)

                  /** Busca si hay una versión nueva publicada en GitHub (solo descarga un pequeño archivo version.json). */
                  @JavascriptInterface
                  fun checkUpdate(repo: String) {
                      if (!Regex("^[\\w.-]+/[\\w.-]+$").matches(repo)) return
                      Thread {
                          runCatching {
                              val c = java.net.URL("https://github.com/$repo/releases/latest/download/version.json").openConnection() as java.net.HttpURLConnection
                              c.connectTimeout = 8000; c.readTimeout = 8000; c.instanceFollowRedirects = true
                              c.setRequestProperty("Cache-Control", "no-cache")
                              if (c.responseCode == 200) {
                                  val txt = c.inputStream.bufferedReader().use { it.readText() }
                                  val o = JSONObject(txt)
                                  js("window.nxOnUpdate && nxOnUpdate(${o})")
                              }
                              c.disconnect()
                          }
                      }.start()
                  }

                  /** Guarda la copia de seguridad en Descargas/Nexora y devuelve su dirección. */
                  @JavascriptInterface
                  fun saveBackup(json: String, name: String): String = runCatching {
                      val values = android.content.ContentValues().apply {
                          put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name)
                          put(android.provider.MediaStore.MediaColumns.MIME_TYPE, "application/json")
                          put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/Nexora")
                      }
                      val uri = contentResolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)!!
                      contentResolver.openOutputStream(uri)!!.use { it.write(json.toByteArray(Charsets.UTF_8)) }
                      uri.toString()
                  }.getOrDefault("")

                  /** Abre "Compartir" para guardar la copia en Google Drive, WhatsApp, etc. */
                  @JavascriptInterface
                  fun shareBackup(uri: String) = runOnUiThread {
                      runCatching {
                          val send = Intent(Intent.ACTION_SEND).setType("application/json")
                              .putExtra(Intent.EXTRA_STREAM, Uri.parse(uri))
                              .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          startActivity(Intent.createChooser(send, "Guardar copia de seguridad"))
                      }
                  }

                  /** Guarda una imagen (PNG en base64) en Imágenes/Nexora y abre Compartir. */
                  @JavascriptInterface
                  fun shareImage(b64: String, name: String) = runOnUiThread {
                      runCatching {
                          val bytes = android.util.Base64.decode(b64.substringAfter(","), android.util.Base64.DEFAULT)
                          val values = android.content.ContentValues().apply {
                              put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name)
                              put(android.provider.MediaStore.MediaColumns.MIME_TYPE, "image/png")
                              put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_PICTURES + "/Nexora")
                          }
                          val uri = contentResolver.insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values)!!
                          contentResolver.openOutputStream(uri)!!.use { it.write(bytes) }
                          val send = Intent(Intent.ACTION_SEND).setType("image/png")
                              .putExtra(Intent.EXTRA_STREAM, uri)
                              .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          startActivity(Intent.createChooser(send, "Compartir"))
                      }.onFailure { js("window.nxToast && nxToast('No se pudo compartir')") }
                  }

                  /** Descarga e instala la nueva versión dentro de la app. */
                  @JavascriptInterface
                  fun downloadUpdate(url: String) = runOnUiThread { Updater.start(this@MainActivity, url) }

                  @JavascriptInterface
                  fun openUrl(url: String) = runOnUiThread {
                      if (url.startsWith("https://") || url.startsWith("http://"))
                          runCatching { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url))) }
                  }

                  /** Actualiza los botones de la ventana flotante según si el video se reproduce. */
                  @JavascriptInterface
                  fun pipState(playing: Boolean) = runOnUiThread {
                      pipPlaying = playing
                      if (isInPictureInPictureMode) runCatching { setPictureInPictureParams(pipParams(pipW, pipH)) }
                  }

                  /** Ventana flotante (imagen en imagen) para los videos. */
                  @JavascriptInterface
                  fun enterPip(w: Int, h: Int) = runOnUiThread {
                      runCatching {
                          pipW = w; pipH = h
                          enterPictureInPictureMode(pipParams(w, h))
                      }.onFailure { js("window.nxToast && nxToast('Tu teléfono no permite ventana flotante')") }
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  when (requestCode) {
                      REQ_MEDIA -> js("window.nxOnPermissions && nxOnPermissions(${permState()})")
                      REQ_NOTIF -> js("window.nxOnNotif && nxOnNotif(${permState().optBoolean("notif")})")
                      REQ_REC -> {
                          val ok = grantResults.isNotEmpty() && grantResults[0] == android.content.pm.PackageManager.PERMISSION_GRANTED
                          nat.setViz(ok)
                          js("window.nxVizPerm && nxVizPerm($ok)")
                      }
                  }
              }

