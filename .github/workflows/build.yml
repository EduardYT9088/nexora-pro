                  if (img != null) b.setStyle(Notification.BigPictureStyle().bigPicture(img).setSummaryText(text)) else b.setStyle(Notification.BigTextStyle().bigText(text))
                  nm.notify(7500 + hour, b.build())
              }
          }

          class MusicTimeReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action == "com.nexora.pro.MUSIC_TIME") MusicTime.fire(c, i.getIntExtra("hour", 8))
                  else MusicTime.schedule(c)
                  // Tras reiniciar el teléfono o actualizar la app se reactivan también los avisos de archivos nuevos
                  NewMedia.schedule(c); NewMedia.periodic(c); NewMedia.watch(c)
                  Thread { runCatching { NewMedia.check(c) } }.start()
              }
          }
