          package com.nexora.pro

          import android.content.ContentUris
          import android.content.Context
          import android.os.ParcelFileDescriptor
          import android.provider.MediaStore
          import java.io.BufferedOutputStream
          import java.io.IOException
          import java.io.InputStream
          import java.net.InetAddress
          import java.net.ServerSocket
          import java.net.Socket
          import java.util.UUID
          import java.util.concurrent.Executors

          /**
           * Pequeño servidor local (solo 127.0.0.1) que entrega la música y los videos al reproductor
           * con soporte completo de rangos, para que carguen y se puedan adelantar sin problemas.
           * Cada inicio usa una clave aleatoria en la ruta, así otras apps no pueden leer tus archivos.
           */
          object MediaHttpServer {
              private val token = UUID.randomUUID().toString().replace("-", "")
              private var server: ServerSocket? = null
              private val pool = Executors.newCachedThreadPool()
              private lateinit var appCtx: Context

              @Synchronized
              fun base(ctx: Context): String {
                  appCtx = ctx.applicationContext
                  val s = server?.takeIf { !it.isClosed } ?: start()
                  return "http://127.0.0.1:${s.localPort}/$token"
              }

              private fun start(): ServerSocket {
                  val s = ServerSocket(0, 50, InetAddress.getByName("127.0.0.1"))
                  server = s
                  Thread({
                      while (!s.isClosed) {
                          val client = try { s.accept() } catch (e: IOException) { break }
                          pool.execute { serve(client) }
                      }
                  }, "NexoraMediaServer").apply { isDaemon = true }.start()
                  return s
              }

              private fun readLine(input: InputStream): String? {
                  val sb = StringBuilder()
                  while (true) {
                      val b = input.read()
                      if (b == -1) return if (sb.isEmpty()) null else sb.toString()
                      if (b == '\n'.code) return sb.toString().trimEnd('\r')
                      if (sb.length > 8192) return null
                      sb.append(b.toChar())
                  }
              }

              private fun serve(sock: Socket) {
                  try {
                      sock.use { s ->
                          s.soTimeout = 30000
                          val input = s.getInputStream()
                          val requestLine = readLine(input) ?: return
                          val headers = HashMap<String, String>()
                          while (true) {
                              val line = readLine(input) ?: break
                              if (line.isEmpty()) break
                              val i = line.indexOf(':')
                              if (i > 0) headers[line.substring(0, i).trim().lowercase()] = line.substring(i + 1).trim()
                          }
                          val parts = requestLine.split(" ")
                          val method = parts.getOrNull(0) ?: "GET"
                          val path = (parts.getOrNull(1) ?: "/").substringBefore('?')
                          val out = BufferedOutputStream(s.getOutputStream(), 64 * 1024)

                          // Ruta esperada: /<token>/media/<audio|video>/<id>
                          val seg = path.trim('/').split('/')
                          if (seg.size != 4 || seg[0] != token || seg[1] != "media" || seg[3].toLongOrNull() == null) {
                              status(out, 404, "Not Found", "text/plain", 0, null); out.flush(); return
                          }
                          val type = seg[2]
                          val base = if (type == "video") MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                                     else MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                          val uri = ContentUris.withAppendedId(base, seg[3].toLong())
                          val pfd = appCtx.contentResolver.openFileDescriptor(uri, "r")
                          if (pfd == null) { status(out, 404, "Not Found", "text/plain", 0, null); out.flush(); return }
                          val total = pfd.statSize
                          val mime = appCtx.contentResolver.getType(uri) ?: if (type == "video") "video/mp4" else "audio/mpeg"
                          ParcelFileDescriptor.AutoCloseInputStream(pfd).use { file ->
                              var start = 0L
                              var end = total - 1
                              var partial = false
                              val range = headers["range"]
                              if (range != null && total > 0) {
                                  val m = Regex("bytes=(\\d*)-(\\d*)").find(range)
                                  val a = m?.groupValues?.get(1).orEmpty()
                                  val b = m?.groupValues?.get(2).orEmpty()
                                  if (a.isEmpty() && b.isNotEmpty()) {
                                      start = maxOf(0L, total - b.toLong())
                                  } else {
                                      start = a.toLongOrNull() ?: 0L
                                      end = b.toLongOrNull() ?: (total - 1)
                                  }
                                  end = minOf(end, total - 1)
                                  if (start >= total || start > end) {
                                      status(out, 416, "Range Not Satisfiable", mime, 0, "bytes */$total")
                                      out.flush(); return
                                  }
                                  partial = true
                              }
                              val len = if (total > 0) end - start + 1 else 0
                              if (partial) status(out, 206, "Partial Content", mime, len, "bytes $start-$end/$total")
                              else status(out, 200, "OK", mime, len, null)
                              if (method == "HEAD") { out.flush(); return }

                              var skipped = 0L
                              while (skipped < start) {
                                  val n = file.skip(start - skipped)
                                  if (n <= 0) break
                                  skipped += n
                              }
                              val buf = ByteArray(64 * 1024)
                              var left = len
                              while (left > 0) {
                                  val n = file.read(buf, 0, minOf(buf.size.toLong(), left).toInt())
                                  if (n < 0) break
                                  out.write(buf, 0, n)
                                  left -= n
                              }
                              out.flush()
                          }
                      }
                  } catch (e: Exception) {
                      // El reproductor cierra la conexión al adelantar o cambiar de canción: es normal.
                  }
              }

              private fun status(out: BufferedOutputStream, code: Int, msg: String, mime: String, len: Long, contentRange: String?) {
                  val sb = StringBuilder()
                  sb.append("HTTP/1.1 $code $msg\r\n")
                  sb.append("Content-Type: $mime\r\n")
                  sb.append("Accept-Ranges: bytes\r\n")
                  sb.append("Access-Control-Allow-Origin: *\r\n")
                  sb.append("Cache-Control: no-store\r\n")
                  sb.append("Connection: close\r\n")
                  if (contentRange != null) sb.append("Content-Range: $contentRange\r\n")
                  sb.append("Content-Length: $len\r\n\r\n")
                  out.write(sb.toString().toByteArray(Charsets.US_ASCII))
              }
          }
