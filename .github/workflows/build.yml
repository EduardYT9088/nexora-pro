          package com.nexora.pro

          import android.content.ContentUris
          import android.content.Context
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.audiofx.Equalizer
          import android.media.audiofx.LoudnessEnhancer
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.MediaStore
          import org.json.JSONArray
          import kotlin.math.ln
          import kotlin.math.log10

          /**
           * Reproductor nativo para el modo "Reproduce junto con otras aplicaciones".
           * MediaPlayer no pide el foco de audio, así que Nexora suena junto con otras apps
           * sin pausarlas ni ser pausado por ellas. Incluye ecualizador y amplificador nativos.
           */
          class NativeAudioPlayer(private val ctx: Context, private val emit: (String, Double) -> Unit) {

              private val main = Handler(Looper.getMainLooper())
              private var mp: MediaPlayer? = null
              private var prepared = false
              private var wantPlay = false
              private var pendingSeek = -1L
              private var rate = 1f
              private var vol = 1f
              private var eq: Equalizer? = null
              private var loud: LoudnessEnhancer? = null
              private var eqOn = false
              private var eqGains = DoubleArray(10)
              private var boost = 100
              private val freqs = doubleArrayOf(31.0, 62.0, 125.0, 250.0, 500.0, 1000.0, 2000.0, 4000.0, 8000.0, 16000.0)

              private val ticker = object : Runnable {
                  override fun run() {
                      val p = mp ?: return
                      if (prepared && p.isPlaying) {
                          emit("time", p.currentPosition / 1000.0)
                          main.postDelayed(this, 250)
                      }
                  }
              }

              fun load(url: String) {
                  release()
                  val m = Regex("/media/(audio|video)/(\\d+)").find(url)
                  if (m == null) { emit("error", 0.0); return }
                  val base = if (m.groupValues[1] == "video") MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                             else MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val uri = ContentUris.withAppendedId(base, m.groupValues[2].toLong())
                  val p = MediaPlayer()
                  mp = p; prepared = false; wantPlay = false; pendingSeek = -1
                  p.setAudioAttributes(AudioAttributes.Builder()
                      .setUsage(AudioAttributes.USAGE_MEDIA)
                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                  runCatching { p.setWakeMode(ctx, PowerManager.PARTIAL_WAKE_LOCK) }
                  p.setOnPreparedListener {
                      if (mp !== it) return@setOnPreparedListener
                      prepared = true
                      it.setVolume(vol, vol)
                      applyEffects()
                      emit("meta", it.duration / 1000.0)
                      if (pendingSeek >= 0) { it.seekTo(pendingSeek.toInt()); pendingSeek = -1 }
                      if (wantPlay) start()
                  }
                  p.setOnCompletionListener { if (mp === it) { main.removeCallbacks(ticker); emit("ended", 0.0) } }
                  p.setOnErrorListener { mpx, _, _ -> if (mp === mpx) emit("error", 0.0); true }
                  p.setOnSeekCompleteListener { if (mp === it) emit("seeked", it.currentPosition / 1000.0) }
                  try {
                      p.setDataSource(ctx, uri)
                      p.prepareAsync()
                  } catch (e: Exception) {
                      emit("error", 0.0)
                  }
              }

              private fun start() {
                  val p = mp ?: return
                  try {
                      p.start()
                      if (rate != 1f) p.playbackParams = p.playbackParams.setSpeed(rate)
                  } catch (e: Exception) { }
                  main.removeCallbacks(ticker)
                  main.post(ticker)
              }

              fun play() { wantPlay = true; if (prepared) start() }

              fun pause() {
                  wantPlay = false
                  val p = mp ?: return
                  main.removeCallbacks(ticker)
                  if (prepared) {
                      runCatching { if (p.isPlaying) p.pause() }
                      emit("time", p.currentPosition / 1000.0)
                  }
              }

              fun seek(ms: Long) {
                  val p = mp ?: return
                  if (prepared) runCatching { p.seekTo(ms.toInt()) } else pendingSeek = ms
              }

              fun setRate(r: Double) {
                  rate = r.toFloat()
                  val p = mp ?: return
                  if (prepared && p.isPlaying) runCatching { p.playbackParams = p.playbackParams.setSpeed(rate) }
              }

              fun setVolume(v: Double) {
                  vol = v.toFloat().coerceIn(0f, 1f)
                  runCatching { mp?.setVolume(vol, vol) }
              }

              fun setEq(on: Boolean, gainsJson: String) {
                  eqOn = on
                  runCatching {
                      val a = JSONArray(gainsJson)
                      for (i in 0 until minOf(10, a.length())) eqGains[i] = a.getDouble(i)
                  }
                  applyEffects()
              }

              fun setBoost(level: Int) { boost = level.coerceIn(100, 300); applyEffects() }

              /** Ganancia (dB) de nuestra curva de 10 bandas para una frecuencia cualquiera. */
              private fun gainAt(hz: Double): Double {
                  if (hz <= freqs[0]) return eqGains[0]
                  if (hz >= freqs[9]) return eqGains[9]
                  for (i in 0 until 9) {
                      if (hz <= freqs[i + 1]) {
                          val t = (ln(hz) - ln(freqs[i])) / (ln(freqs[i + 1]) - ln(freqs[i]))
                          return eqGains[i] + (eqGains[i + 1] - eqGains[i]) * t
                      }
                  }
                  return 0.0
              }

              private fun applyEffects() {
                  val p = mp ?: return
                  if (!prepared) return
                  val sid = p.audioSessionId
                  runCatching {
                      if (eq == null && eqOn) eq = Equalizer(0, sid)
                      eq?.let { e ->
                          val range = e.bandLevelRange
                          for (b in 0 until e.numberOfBands) {
                              val hz = e.getCenterFreq(b.toShort()) / 1000.0
                              val mb = (gainAt(hz) * 100).toInt().coerceIn(range[0].toInt(), range[1].toInt())
                              e.setBandLevel(b.toShort(), mb.toShort())
                          }
                          e.enabled = eqOn
                      }
                  }
                  runCatching {
                      if (loud == null && boost > 100) loud = LoudnessEnhancer(sid)
                      loud?.let { l ->
                          l.setTargetGain((2000 * log10(boost / 100.0)).toInt())
                          l.enabled = boost > 100
                      }
                  }
              }

              fun release() {
                  main.removeCallbacks(ticker)
                  runCatching { eq?.release() }; eq = null
                  runCatching { loud?.release() }; loud = null
                  runCatching { mp?.release() }; mp = null
                  prepared = false; wantPlay = false
              }
          }
          NXEOF
          cat > app/src/main/java/com/nexora/pro/PlaybackService.kt <<'NXEOF'
          package com.nexora.pro

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.drawable.Icon
          import android.media.MediaMetadata
          import android.media.session.MediaSession
          import android.media.session.PlaybackState
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.MediaStore
          import android.util.Size
          import org.json.JSONObject

          /**
           * Mantiene la música sonando en segundo plano y muestra los controles
           * en la notificación y en la pantalla de bloqueo.
           */
          class PlaybackService : Service() {

              companion object {
                  private const val CHANNEL = "nexora_playback"
                  private const val NOTIF_ID = 7
                  var listener: ((String) -> Unit)? = null
                  private var instance: PlaybackService? = null
                  private var pending: JSONObject? = null

                  fun update(ctx: Context, s: JSONObject) {
                      if (s.optBoolean("stop")) { instance?.stopAll(); pending = null; return }
                      val inst = instance
                      if (inst != null) { inst.apply(s); return }
                      if (!s.optBoolean("playing")) return
                      pending = s
                      runCatching { ctx.startForegroundService(Intent(ctx, PlaybackService::class.java)) }
                  }
              }

              private val main = Handler(Looper.getMainLooper())
              private lateinit var session: MediaSession
              private var state = JSONObject()
              private var artKey: String? = null
              private var art: Bitmap? = null
              private lateinit var am: android.media.AudioManager
              private var focusReq: android.media.AudioFocusRequest? = null
              private var hasFocus = false
              private var resumeOnGain = false
              private val noisy = object : android.content.BroadcastReceiver() {
                  override fun onReceive(c: Context?, i: Intent?) { send("pause") }  // se desconectaron los audífonos
              }
              private val focusListener = android.media.AudioManager.OnAudioFocusChangeListener { change ->
                  when (change) {
                      android.media.AudioManager.AUDIOFOCUS_LOSS -> { hasFocus = false; resumeOnGain = false; send("pause") }
                      android.media.AudioManager.AUDIOFOCUS_LOSS_TRANSIENT -> {
                          if (state.optBoolean("playing")) { resumeOnGain = true; send("pause") }
                      }
                      android.media.AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK -> send("duck")
                      android.media.AudioManager.AUDIOFOCUS_GAIN -> {
                          send("unduck")
                          if (resumeOnGain) { resumeOnGain = false; send("play") }
                      }
                  }
              }

              private fun updateFocus(playing: Boolean, mix: Boolean) {
                  if (mix) { abandonFocus(); return }
                  if (playing && !hasFocus) {
                      val attrs = android.media.AudioAttributes.Builder()
                          .setUsage(android.media.AudioAttributes.USAGE_MEDIA)
                          .setContentType(android.media.AudioAttributes.CONTENT_TYPE_MUSIC).build()
                      val req = android.media.AudioFocusRequest.Builder(android.media.AudioManager.AUDIOFOCUS_GAIN)
                          .setAudioAttributes(attrs).setOnAudioFocusChangeListener(focusListener, main)
                          .setWillPauseWhenDucked(false).build()
                      focusReq = req
                      hasFocus = am.requestAudioFocus(req) == android.media.AudioManager.AUDIOFOCUS_REQUEST_GRANTED
                  }
              }

              private fun abandonFocus() {
                  focusReq?.let { am.abandonAudioFocusRequest(it) }
                  focusReq = null; hasFocus = false; resumeOnGain = false
              }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  am = getSystemService(android.media.AudioManager::class.java)
                  val f = android.content.IntentFilter(android.media.AudioManager.ACTION_AUDIO_BECOMING_NOISY)
                  if (android.os.Build.VERSION.SDK_INT >= 33) registerReceiver(noisy, f, Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(noisy, f)
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL, "Reproducción", NotificationManager.IMPORTANCE_LOW).apply {
                          description = "Controles de música de Nexora Pro"
                          setShowBadge(false)
                      }
                  )
                  session = MediaSession(this, "NexoraPro").apply {
                      setCallback(object : MediaSession.Callback() {
                          override fun onPlay() = send("play")
                          override fun onPause() = send("pause")
                          override fun onSkipToNext() = send("next")
                          override fun onSkipToPrevious() = send("prev")
                          override fun onStop() = send("pause")
                          override fun onSeekTo(pos: Long) = send("seek:$pos")
                      })
                      isActive = true
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (val a = intent?.action) {
                      "play", "pause", "next", "prev" -> send(a)
                      "toggle" -> send(if (state.optBoolean("playing")) "pause" else "play")
                  }
                  val p = pending
                  pending = null
                  apply(p ?: state)
                  return START_NOT_STICKY
              }

              private fun send(action: String) { main.post { listener?.invoke(action) } }

              fun apply(s: JSONObject) {
                  state = s
                  val key = s.optString("artType") + ":" + s.optLong("artId", -1)
                  if (key != artKey) {
                      artKey = key
                      art = null
                      val type = s.optString("artType")
                      val id = s.optLong("artId", -1)
                      if (id >= 0 && type.isNotEmpty()) {
                          Thread {
                              val bmp = runCatching {
                                  val base = if (type == "video") MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                                             else MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                                  contentResolver.loadThumbnail(ContentUris.withAppendedId(base, id), Size(512, 512), null)
                              }.getOrNull()
                              main.post { if (artKey == key) { art = bmp; publish() } }
                          }.start()
                      }
                  }
                  publish()
              }

              private fun publish() {
                  val s = state
                  val playing = s.optBoolean("playing")
                  val title = s.optString("title", "Nexora Pro")
                  val artist = s.optString("artist", "")
                  val durMs = (s.optDouble("duration", 0.0) * 1000).toLong()
                  val posMs = (s.optDouble("position", 0.0) * 1000).toLong()
                  val speed = s.optDouble("speed", 1.0).toFloat()

                  session.setMetadata(MediaMetadata.Builder()
                      .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                      .putString(MediaMetadata.METADATA_KEY_ARTIST, artist)
                      .putLong(MediaMetadata.METADATA_KEY_DURATION, durMs)
                      .apply { art?.let { putBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART, it) } }
                      .build())
                  session.setPlaybackState(PlaybackState.Builder()
                      .setActions(PlaybackState.ACTION_PLAY or PlaybackState.ACTION_PAUSE or
                          PlaybackState.ACTION_PLAY_PAUSE or PlaybackState.ACTION_SKIP_TO_NEXT or
                          PlaybackState.ACTION_SKIP_TO_PREVIOUS or PlaybackState.ACTION_SEEK_TO or
                          PlaybackState.ACTION_STOP)
                      .setState(if (playing) PlaybackState.STATE_PLAYING else PlaybackState.STATE_PAUSED,
                          posMs, if (playing) speed else 0f)
                      .build())

                  val n = build(title, artist, playing)
                  try {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                  } catch (e: Exception) {
                      runCatching { getSystemService(NotificationManager::class.java).notify(NOTIF_ID, n) }
                  }
              }

              private fun pi(action: String, code: Int) = PendingIntent.getService(
                  this, code, Intent(this, PlaybackService::class.java).setAction(action),
                  PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
              )

              private fun build(title: String, artist: String, playing: Boolean): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  fun action(icon: Int, label: String, a: String, code: Int) =
                      Notification.Action.Builder(Icon.createWithResource(this, icon), label, pi(a, code)).build()

                  return Notification.Builder(this, CHANNEL)
                      .setSmallIcon(R.drawable.ic_stat_nexora)
                      .setContentTitle(title)
                      .setContentText(artist)
                      .setLargeIcon(art)
                      .setContentIntent(open)
                      .setOngoing(playing)
                      .setShowWhen(false)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .setColor(0xFF6C4CF5.toInt())
                      .addAction(action(R.drawable.ic_n_prev, "Anterior", "prev", 1))
                      .addAction(if (playing) action(R.drawable.ic_n_pause, "Pausar", "pause", 2)
                                 else action(R.drawable.ic_n_play, "Reproducir", "play", 3))
                      .addAction(action(R.drawable.ic_n_next, "Siguiente", "next", 4))
                      .setStyle(Notification.MediaStyle()
                          .setMediaSession(session.sessionToken)
                          .setShowActionsInCompactView(0, 1, 2))
                      .build()
              }

              fun stopAll() {
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  stopAll()
                  super.onTaskRemoved(rootIntent)
              }

              override fun onDestroy() {
                  runCatching { unregisterReceiver(noisy) }
                  session.isActive = false
                  session.release()
                  instance = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
