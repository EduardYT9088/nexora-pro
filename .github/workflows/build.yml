              /** Abre un video o canción que otra app (Nexora Download, un explorador de archivos…) le pasó a Nexora Pro. */
              private fun handleExternal(intent: Intent?) {
                  if (intent == null || intent.action != Intent.ACTION_VIEW) return
                  val uri = intent.data ?: return
                  intent.data = null
                  val mime = intent.type ?: runCatching { contentResolver.getType(uri) }.getOrNull() ?: ""
                  var title = intent.getStringExtra("nexora_title")
                  if (title.isNullOrBlank()) title = runCatching {
                      contentResolver.query(uri, arrayOf(android.provider.OpenableColumns.DISPLAY_NAME), null, null, null)
                          ?.use { if (it.moveToFirst()) it.getString(0) else null }
                  }.getOrNull()
                  if (title.isNullOrBlank()) title = uri.lastPathSegment ?: "Archivo"
                  val url = MediaHttpServer.externalUrl(this, uri)
                  val type = when {
                      mime.startsWith("video") -> "video"
                      mime.startsWith("audio") -> "audio"
                      Regex("\\.(mp4|mkv|webm|3gp|mov|avi)$", RegexOption.IGNORE_CASE).containsMatchIn(title) -> "video"
                      else -> "audio"
                  }
                  val json = JSONObject().put("url", url).put("title", title).put("type", type).toString()
                  if (pageReady) js("window.nxOpenExternal && nxOpenExternal($json)") else pendingExternal = json
              }

