          package com.nexora.pro

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageInstaller
          import android.net.Uri
          import android.provider.Settings
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * Descarga el APK nuevo desde GitHub y lo instala encima, dentro de la app.
           * Android siempre muestra su ventana de confirmación antes de instalar.
           */
          object Updater {
              var listener: ((String, Int) -> Unit)? = null
              @Volatile private var running = false

              fun start(act: Activity, apkUrl: String) {
                  if (running) return
                  if (!apkUrl.startsWith("https://github.com/")) { listener?.invoke("error", 0); return }
                  if (!act.packageManager.canRequestPackageInstalls()) {
                      // Primero hay que permitir "Instalar apps desconocidas" para Nexora Pro.
                      listener?.invoke("perm", 0)
                      runCatching {
                          act.startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:" + act.packageName)))
                      }
                      return
                  }
                  running = true
                  Thread {
                      try {
                          var url = URL(apkUrl)
                          var conn: HttpURLConnection
                          var hops = 0
                          while (true) {
                              conn = url.openConnection() as HttpURLConnection
                              conn.instanceFollowRedirects = false
                              conn.connectTimeout = 15000; conn.readTimeout = 30000
                              val code = conn.responseCode
                              if (code in 300..399 && hops++ < 6) {
                                  url = URL(url, conn.getHeaderField("Location")); conn.disconnect(); continue
                              }
                              if (code != 200) throw IllegalStateException("HTTP $code")
                              break
                          }
                          val total = conn.contentLengthLong
                          val installer = act.packageManager.packageInstaller
                          val params = PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL)
                          params.setAppPackageName(act.packageName)
                          if (total > 0) params.setSize(total)
                          val id = installer.createSession(params)
                          installer.openSession(id).use { session ->
                              conn.inputStream.use { input ->
                                  session.openWrite("NexoraPro.apk", 0, if (total > 0) total else -1).use { out ->
                                      val buf = ByteArray(64 * 1024)
                                      var done = 0L
                                      var lastPct = -1
                                      while (true) {
                                          val n = input.read(buf)
                                          if (n < 0) break
                                          out.write(buf, 0, n)
                                          done += n
                                          if (total > 0) {
                                              val pct = (done * 100 / total).toInt()
                                              if (pct != lastPct) { lastPct = pct; listener?.invoke("progress", pct) }
                                          }
                                      }
                                      session.fsync(out)
                                  }
                              }
                              conn.disconnect()
                              listener?.invoke("installing", 100)
                              val pi = PendingIntent.getBroadcast(act, 7,
                                  Intent(act, InstallResultReceiver::class.java),
                                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE)
                              session.commit(pi.intentSender)
                          }
                      } catch (e: Exception) {
                          listener?.invoke("error", 0)
                      } finally {
                          running = false
                      }
                  }.start()
              }
          }

          /** Recibe la respuesta del instalador de Android. */
          class InstallResultReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE)) {
                      PackageInstaller.STATUS_PENDING_USER_ACTION -> {
                          @Suppress("DEPRECATION")
                          val confirm = intent.getParcelableExtra<Intent>(Intent.EXTRA_INTENT)
                          if (confirm != null) {
                              confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              runCatching { context.startActivity(confirm) }
                          }
                      }
                      PackageInstaller.STATUS_SUCCESS -> Updater.listener?.invoke("done", 100)
                      else -> Updater.listener?.invoke("error", 0)
                  }
              }
          }
