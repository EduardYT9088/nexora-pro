                  prefs(c).edit().putBoolean("mtOn", on).putString("mtStrings", json).apply()
              }

              private fun str(c: Context, k: String, d: String): String {
                  val s = runCatching { JSONObject(prefs(c).getString("mtStrings", "{}") ?: "{}") }.getOrDefault(JSONObject())
                  return s.optString(k, d)
              }

              private fun pending(c: Context, hour: Int): PendingIntent =
                  PendingIntent.getBroadcast(
                      c, 9000 + hour, Intent(c, MusicTimeReceiver::class.java).setAction("com.nexora.pro.MUSIC_TIME").putExtra("hour", hour),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

              /** Programa (o cancela) los próximos avisos. Alarmas aproximadas: no necesitan permisos especiales. */
              fun schedule(c: Context) {
                  val am = c.getSystemService(AlarmManager::class.java) ?: return
                  val on = prefs(c).getBoolean("mtOn", true)
                  for (h in HOURS) {
                      val pi = pending(c, h)
                      if (!on) { am.cancel(pi); continue }
                      val cal = Calendar.getInstance().apply {
                          set(Calendar.HOUR_OF_DAY, h); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                          if (timeInMillis <= System.currentTimeMillis() + 60_000) add(Calendar.DAY_OF_YEAR, 1)
                      }
                      val exact = Build.VERSION.SDK_INT < 31 || runCatching { am.canScheduleExactAlarms() }.getOrDefault(false)
                      runCatching {
                          if (exact) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                          else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pi)
                      }
