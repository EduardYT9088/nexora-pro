          package com.nexora.pro

          import android.content.Context
          import android.net.Uri
          import android.provider.BaseColumns
          import android.provider.MediaStore
          import org.json.JSONArray
          import org.json.JSONObject

          /** Busca toda la música y los videos del teléfono usando la biblioteca de Android (MediaStore). */
          object MediaScanner {

              fun scan(ctx: Context): String {
                  val out = JSONArray()
                  runCatching { query(ctx, MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, "audio", out) }
                  runCatching { query(ctx, MediaStore.Video.Media.EXTERNAL_CONTENT_URI, "video", out) }
                  return out.toString()
              }

              private fun query(ctx: Context, uri: Uri, type: String, out: JSONArray) {
                  val cols = mutableListOf(
                      BaseColumns._ID,
                      MediaStore.MediaColumns.TITLE,
                      MediaStore.MediaColumns.DISPLAY_NAME,
                      MediaStore.MediaColumns.DURATION,
                      MediaStore.MediaColumns.SIZE,
                      MediaStore.MediaColumns.DATE_ADDED,
                      MediaStore.MediaColumns.BUCKET_DISPLAY_NAME,
                      MediaStore.MediaColumns.MIME_TYPE
                  )
                  val selection: String
                  if (type == "audio") {
                      cols += MediaStore.Audio.AudioColumns.ARTIST
                      cols += MediaStore.Audio.AudioColumns.ALBUM
                      // Sin tonos de llamada, alarmas ni sonidos de notificación.
                      selection = "${MediaStore.MediaColumns.DURATION} >= 3000 AND " +
                          "${MediaStore.Audio.AudioColumns.IS_RINGTONE} = 0 AND " +
                          "${MediaStore.Audio.AudioColumns.IS_ALARM} = 0 AND " +
                          "${MediaStore.Audio.AudioColumns.IS_NOTIFICATION} = 0"
                  } else {
                      cols += MediaStore.MediaColumns.WIDTH
                      cols += MediaStore.MediaColumns.HEIGHT
                      selection = "${MediaStore.MediaColumns.DURATION} > 0"
                  }

                  ctx.contentResolver.query(
                      uri, cols.toTypedArray(), selection, null,
                      "${MediaStore.MediaColumns.DATE_ADDED} DESC"
                  )?.use { c ->
                      fun idx(n: String) = c.getColumnIndex(n)
                      val iId = idx(BaseColumns._ID)
                      val iTitle = idx(MediaStore.MediaColumns.TITLE)
                      val iName = idx(MediaStore.MediaColumns.DISPLAY_NAME)
                      val iDur = idx(MediaStore.MediaColumns.DURATION)
                      val iSize = idx(MediaStore.MediaColumns.SIZE)
                      val iAdded = idx(MediaStore.MediaColumns.DATE_ADDED)
                      val iBucket = idx(MediaStore.MediaColumns.BUCKET_DISPLAY_NAME)
                      val iArtist = idx(MediaStore.Audio.AudioColumns.ARTIST)
                      val iAlbum = idx(MediaStore.Audio.AudioColumns.ALBUM)
                      val iW = idx(MediaStore.MediaColumns.WIDTH)
                      val iH = idx(MediaStore.MediaColumns.HEIGHT)

                      fun str(i: Int) = if (i >= 0 && !c.isNull(i)) c.getString(i) else ""
                      fun num(i: Int) = if (i >= 0 && !c.isNull(i)) c.getLong(i) else 0L

                      while (c.moveToNext()) {
                          var artist = str(iArtist)
                          if (artist == "<unknown>") artist = ""
                          out.put(JSONObject().apply {
                              put("id", num(iId))
                              put("type", type)
                              put("title", str(iTitle))
                              put("name", str(iName))
                              put("artist", artist)
                              put("album", str(iAlbum))
                              put("duration", num(iDur))
                              put("size", num(iSize))
                              put("added", num(iAdded))
                              put("folder", str(iBucket))
                              put("width", num(iW))
                              put("height", num(iH))
                          })
                      }
                  }
              }
          }
