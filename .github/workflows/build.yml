name: Construir APK de Nexora Pro

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Crear el proyecto Android
        shell: bash
        run: |
          set -e
          mkdir -p proyecto && cd proyecto
          cat > settings.gradle.kts <<'NXEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "NexoraPro"
          include(":app")
          NXEOF
          cat > build.gradle.kts <<'NXEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          NXEOF
          cat > gradle.properties <<'NXEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          NXEOF
          mkdir -p app
          cat > app/build.gradle.kts <<'NXEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.nexora.pro"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.nexora.pro"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 20000
                  versionName = "1.7.0"
              }

              signingConfigs {
                  create("nexora") {
                      storeFile = file("nexora.jks")
                      storePassword = "nexora123"
                      keyAlias = "nexora"
                      keyPassword = "nexora123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      // Firma fija: permite actualizar la app sin desinstalarla.
                      signingConfig = signingConfigs.getByName("nexora")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              // Inicio de sesión con Google y permiso para guardar la copia de seguridad en Drive
              implementation("com.google.android.gms:play-services-auth:21.2.0")
              // Ventana oficial para calificar la app sin salir de ella
              implementation("com.google.android.play:review:2.0.2")
          }
          NXEOF
          cat > app/proguard-rules.pro <<'NXEOF'
          # Métodos que la interfaz llama desde JavaScript
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes JavascriptInterface
          NXEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'NXEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Leer la música y los videos del teléfono -->
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
              <!-- Controles en la notificación y música en segundo plano -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <!-- Poner una canción como tono de llamada, alarma o notificación -->
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <!-- Solo para el visualizador de música: lee la intensidad del sonido que reproduce Nexora; no graba ni guarda nada -->
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <!-- Necesario para el servidor local 127.0.0.1 que entrega la música al reproductor; la app no usa internet -->
              <uses-permission android:name="android.permission.INTERNET" />
              <!-- Instalar las actualizaciones de Nexora Pro dentro de la app (Android siempre pide confirmar) -->
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <!-- Pasar a la versión de Google Play: quitar esta versión de GitHub -->
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Nexora"
                  android:hardwareAccelerated="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Abrir canciones y videos desde otras apps (Nexora Download, exploradores de archivos…) -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" />
                          <data android:scheme="file" />
                          <data android:mimeType="audio/*" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".InstallResultReceiver"
                      android:exported="false" />

                  <receiver android:name=".MusicTimeReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <service
                      android:name=".NewMediaJobService"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />

                  <service
                      android:name=".NewMediaWatchService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="media_library_watcher" />
                  </service>

                  <receiver android:name=".NexoraWidget" android:exported="true" android:label="Nexora">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/nx_widget_info" />
                  </receiver>

                  <receiver android:name=".NexoraWidgetSmall" android:exported="true" android:label="Nexora (barra)">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/nx_widget_small_info" />
                  </receiver>

                  <service
                      android:name=".PlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
              </application>
          </manifest>
          NXEOF
          mkdir -p app/src/main/java/com/nexora/pro
          cat > app/src/main/java/com/nexora/pro/FileActions.kt <<'NXEOF'
          package com.nexora.pro

          import android.app.Activity
          import android.app.RecoverableSecurityException
          import android.content.ContentUris
          import android.content.ContentValues
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import org.json.JSONArray

          /** Compartir, mover a la papelera y renombrar archivos de música y video del teléfono. */
          class FileActions(private val act: Activity, private val js: (String) -> Unit) {

              companion object {
                  const val REQ_TRASH = 21
                  const val REQ_RENAME = 22
                  const val REQ_RESTORE = 23
                  const val REQ_DELETE_FOREVER = 24
              }

              /** Lista lo que está en la papelera del teléfono (Android 11+). */
              fun listTrash(): String {
                  val out = JSONArray()
                  if (Build.VERSION.SDK_INT < 30) return out.toString()
                  for ((type, base) in listOf("audio" to MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                                               "video" to MediaStore.Video.Media.EXTERNAL_CONTENT_URI)) {
                      val args = android.os.Bundle().apply {
                          putInt(MediaStore.QUERY_ARG_MATCH_TRASHED, MediaStore.MATCH_ONLY)
                          putString(android.content.ContentResolver.QUERY_ARG_SQL_SORT_ORDER,
                              "${MediaStore.MediaColumns.DATE_EXPIRES} ASC")
                      }
                      val cols = arrayOf(android.provider.BaseColumns._ID, MediaStore.MediaColumns.DISPLAY_NAME,
                          MediaStore.MediaColumns.TITLE, MediaStore.MediaColumns.DURATION,
                          MediaStore.MediaColumns.DATE_EXPIRES, MediaStore.MediaColumns.SIZE,
                          MediaStore.MediaColumns.BUCKET_DISPLAY_NAME)
                      runCatching {
                          act.contentResolver.query(base, cols, args, null)?.use { c ->
                              while (c.moveToNext()) {
                                  out.put(org.json.JSONObject().apply {
                                      put("type", type)
                                      put("id", c.getLong(0))
                                      put("name", c.getString(1) ?: "")
                                      put("title", c.getString(2) ?: "")
                                      put("duration", c.getLong(3))
                                      put("expires", c.getLong(4))
                                      put("size", c.getLong(5))
                                      put("folder", c.getString(6) ?: "")
                                  })
                              }
                          }
                      }
                  }
                  return out.toString()
              }

              fun restore(json: String) = trashRequest(json, false, REQ_RESTORE, "restore")

              fun deleteForever(json: String) {
                  val uris = parse(json).map { it.second }
                  if (uris.isEmpty() || Build.VERSION.SDK_INT < 30) { js("window.nxOnTrashAction && nxOnTrashAction('delete', false)"); return }
                  try {
                      val pi = MediaStore.createDeleteRequest(act.contentResolver, uris)
                      @Suppress("DEPRECATION")
                      act.startIntentSenderForResult(pi.intentSender, REQ_DELETE_FOREVER, null, 0, 0, 0)
                  } catch (e: Exception) { js("window.nxOnTrashAction && nxOnTrashAction('delete', false)") }
              }

              private fun trashRequest(json: String, value: Boolean, req: Int, kind: String) {
                  val uris = parse(json).map { it.second }
                  if (uris.isEmpty() || Build.VERSION.SDK_INT < 30) { js("window.nxOnTrashAction && nxOnTrashAction('$kind', false)"); return }
                  try {
                      val pi = MediaStore.createTrashRequest(act.contentResolver, uris, value)
                      @Suppress("DEPRECATION")
                      act.startIntentSenderForResult(pi.intentSender, req, null, 0, 0, 0)
                  } catch (e: Exception) { js("window.nxOnTrashAction && nxOnTrashAction('$kind', false)") }
              }

              private var pendingRename: Triple<Uri, String, String>? = null  // uri, nombre, tipo

              fun uriOf(type: String, id: Long): Uri = ContentUris.withAppendedId(
                  if (type == "video") MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  else MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id)

              private fun parse(json: String): List<Pair<String, Uri>> {
                  val arr = JSONArray(json)
                  return (0 until arr.length()).map {
                      val o = arr.getJSONObject(it)
                      val type = o.getString("type")
                      type to uriOf(type, o.getLong("id"))
                  }
              }

              fun share(json: String) {
                  val items = parse(json)
                  if (items.isEmpty()) return
                  val uris = ArrayList(items.map { it.second })
                  val allVideo = items.all { it.first == "video" }
                  val allAudio = items.all { it.first == "audio" }
                  val mime = when { allVideo -> "video/*"; allAudio -> "audio/*"; else -> "*/*" }
                  val send = if (uris.size == 1) Intent(Intent.ACTION_SEND).putExtra(Intent.EXTRA_STREAM, uris[0])
                             else Intent(Intent.ACTION_SEND_MULTIPLE).putParcelableArrayListExtra(Intent.EXTRA_STREAM, uris)
                  send.type = mime
                  send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  runCatching { act.startActivity(Intent.createChooser(send, "Compartir")) }
                      .onFailure { js("window.nxToast && nxToast('No se pudo compartir')") }
              }

              fun trash(json: String) {
                  val uris = parse(json).map { it.second }
                  if (uris.isEmpty()) return
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          val pi = MediaStore.createTrashRequest(act.contentResolver, uris, true)
                          @Suppress("DEPRECATION")
                          act.startIntentSenderForResult(pi.intentSender, REQ_TRASH, null, 0, 0, 0)
                      } else {
                          var ok = true
                          for (u in uris) {
                              try { act.contentResolver.delete(u, null, null) }
                              catch (e: RecoverableSecurityException) {
                                  @Suppress("DEPRECATION")
                                  act.startIntentSenderForResult(e.userAction.actionIntent.intentSender, REQ_TRASH, null, 0, 0, 0)
                                  return
                              }
                              catch (e: Exception) { ok = false }
                          }
                          js("window.nxOnTrash && nxOnTrash($ok)")
                      }
                  } catch (e: Exception) {
                      js("window.nxOnTrash && nxOnTrash(false)")
                  }
              }

              fun rename(type: String, id: Long, newName: String) {
                  val uri = uriOf(type, id)
                  pendingRename = Triple(uri, newName, type)
                  try {
                      if (Build.VERSION.SDK_INT >= 30) {
                          val pi = MediaStore.createWriteRequest(act.contentResolver, listOf(uri))
                          @Suppress("DEPRECATION")
                          act.startIntentSenderForResult(pi.intentSender, REQ_RENAME, null, 0, 0, 0)
                      } else {
                          try { doRename() }
                          catch (e: RecoverableSecurityException) {
                              @Suppress("DEPRECATION")
                              act.startIntentSenderForResult(e.userAction.actionIntent.intentSender, REQ_RENAME, null, 0, 0, 0)
                          }
                      }
                  } catch (e: Exception) {
                      pendingRename = null
                      js("window.nxOnRename && nxOnRename(false)")
                  }
              }

              private fun doRename() {
                  val (uri, name, type) = pendingRename ?: return
                  // Conserva la extensión original del archivo.
                  val oldName = act.contentResolver.query(uri, arrayOf(MediaStore.MediaColumns.DISPLAY_NAME), null, null, null)
                      ?.use { if (it.moveToFirst()) it.getString(0) else null } ?: ""
                  val ext = oldName.substringAfterLast('.', "")
                  val clean = name.replace(Regex("[\\\\/:*?\"<>|]"), "").trim()
                  val display = if (ext.isNotEmpty() && !clean.endsWith(".$ext", true)) "$clean.$ext" else clean
                  val v = ContentValues().apply { put(MediaStore.MediaColumns.DISPLAY_NAME, display) }
                  act.contentResolver.update(uri, v, null, null)
                  if (type == "audio") runCatching {
                      act.contentResolver.update(uri, ContentValues().apply { put(MediaStore.MediaColumns.TITLE, clean) }, null, null)
                  }
                  pendingRename = null
                  js("window.nxOnRename && nxOnRename(true)")
              }

              /** Devuelve true si el resultado era de una de estas acciones. */
              fun onResult(requestCode: Int, resultCode: Int): Boolean {
                  when (requestCode) {
                      REQ_TRASH -> js("window.nxOnTrash && nxOnTrash(${resultCode == Activity.RESULT_OK})")
                      REQ_RESTORE -> js("window.nxOnTrashAction && nxOnTrashAction('restore', ${resultCode == Activity.RESULT_OK})")
                      REQ_DELETE_FOREVER -> js("window.nxOnTrashAction && nxOnTrashAction('delete', ${resultCode == Activity.RESULT_OK})")
                      REQ_RENAME -> {
                          if (resultCode == Activity.RESULT_OK) {
                              try { doRename() } catch (e: Exception) {
                                  pendingRename = null; js("window.nxOnRename && nxOnRename(false)")
                              }
                          } else { pendingRename = null; js("window.nxOnRename && nxOnRename(false)") }
                      }
                      else -> return false
                  }
                  return true
              }
          }
          NXEOF
          cat > app/src/main/java/com/nexora/pro/LocalServer.kt <<'NXEOF'
          package com.nexora.pro

          import android.content.ContentUris
          import android.content.Context
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.ParcelFileDescriptor
          import android.provider.MediaStore
          import android.util.LruCache
          import android.util.Size
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import java.io.ByteArrayInputStream
          import java.io.ByteArrayOutputStream
          import java.io.InputStream

          /**
           * Sirve la interfaz (assets), los archivos de música/video del teléfono y sus portadas
           * desde https://appassets.androidplatform.net, con soporte de rangos para poder adelantar.
           */
          class LocalServer(private val ctx: Context) {

              private val thumbs = object : LruCache<String, ByteArray>(16 * 1024 * 1024) {
                  override fun sizeOf(key: String, value: ByteArray) = value.size
              }

              fun handle(req: WebResourceRequest): WebResourceResponse? {
                  val path = req.url.path ?: return notFound()
                  return try {
                      when {
                          path.startsWith("/assets/") -> asset(path.removePrefix("/assets/"))
                          path.startsWith("/media/") -> media(path, req.requestHeaders)
                          path.startsWith("/thumb/") -> thumb(path, req.url.getQueryParameter("s"))
                          else -> notFound()
                      }
                  } catch (e: Exception) {
                      notFound()
                  }
              }

              private fun contentUri(path: String): Pair<Uri, String> {
                  val parts = path.trim('/').split('/')
                  val type = parts[1]
                  val id = parts[2].toLong()
                  val base = if (type == "video") MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                             else MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  return ContentUris.withAppendedId(base, id) to type
              }

              private fun asset(name: String): WebResourceResponse {
                  val mime = when (name.substringAfterLast('.', "").lowercase()) {
                      "html" -> "text/html"
                      "js" -> "application/javascript"
                      "css" -> "text/css"
                      "svg" -> "image/svg+xml"
                      "png" -> "image/png"
                      "json" -> "application/json"
                      else -> "application/octet-stream"
                  }
                  return WebResourceResponse(mime, "utf-8", ctx.assets.open(name))
              }

              private fun media(path: String, reqHeaders: Map<String, String>?): WebResourceResponse {
                  val (uri, type) = contentUri(path)
                  val pfd = ctx.contentResolver.openFileDescriptor(uri, "r") ?: return notFound()
                  val total = pfd.statSize
                  val mime = ctx.contentResolver.getType(uri) ?: if (type == "video") "video/mp4" else "audio/mpeg"
                  val input = ParcelFileDescriptor.AutoCloseInputStream(pfd)
                  val headers = mutableMapOf(
                      "Accept-Ranges" to "bytes",
                      "Access-Control-Allow-Origin" to "*",
                      "Cache-Control" to "no-store"
                  )
                  val range = reqHeaders?.entries?.firstOrNull { it.key.equals("Range", ignoreCase = true) }?.value
                  if (range != null && total > 0) {
                      val m = Regex("bytes=(\\d*)-(\\d*)").find(range)
                      val a = m?.groupValues?.get(1).orEmpty()
                      val b = m?.groupValues?.get(2).orEmpty()
                      var start: Long
                      var end: Long
                      if (a.isEmpty() && b.isNotEmpty()) {
                          start = maxOf(0L, total - b.toLong()); end = total - 1
                      } else {
                          start = a.toLongOrNull() ?: 0L
                          end = b.toLongOrNull() ?: (total - 1)
                      }
                      end = minOf(end, total - 1)
                      if (start >= total || start > end) {
                          input.close()
                          headers["Content-Range"] = "bytes */$total"
                          return WebResourceResponse(mime, null, 416, "Range Not Satisfiable", headers, ByteArrayInputStream(ByteArray(0)))
                      }
                      var skipped = 0L
                      while (skipped < start) {
                          val s = input.skip(start - skipped)
                          if (s <= 0) break
                          skipped += s
                      }
                      val len = end - start + 1
                      headers["Content-Range"] = "bytes $start-$end/$total"
                      headers["Content-Length"] = len.toString()
                      return WebResourceResponse(mime, null, 206, "Partial Content", headers, LimitedInputStream(input, len))
                  }
                  if (total > 0) headers["Content-Length"] = total.toString()
                  return WebResourceResponse(mime, null, 200, "OK", headers, input)
              }

              private fun thumb(path: String, sizeParam: String?): WebResourceResponse {
                  val px = sizeParam?.toIntOrNull()?.coerceIn(96, 1024) ?: 320
                  val key = "$path@$px"
                  val bytes = thumbs.get(key) ?: run {
                      val (uri, type) = contentUri(path)
                      val bmp = try {
                          ctx.contentResolver.loadThumbnail(uri, Size(px, px), null)
                      } catch (e: Exception) {
                          if (type != "audio") throw e
                          // Algunas canciones (m4a, opus…) guardan la portada de otra forma: la leemos directo del archivo.
                          val mmr = android.media.MediaMetadataRetriever()
                          try {
                              mmr.setDataSource(ctx, uri)
                              val pic = mmr.embeddedPicture ?: throw e
                              val opts = android.graphics.BitmapFactory.Options().apply { inJustDecodeBounds = true }
                              android.graphics.BitmapFactory.decodeByteArray(pic, 0, pic.size, opts)
                              var sample = 1
                              while (opts.outWidth / (sample * 2) >= px && opts.outHeight / (sample * 2) >= px) sample *= 2
                              android.graphics.BitmapFactory.decodeByteArray(pic, 0, pic.size,
                                  android.graphics.BitmapFactory.Options().apply { inSampleSize = sample }) ?: throw e
                          } finally { runCatching { mmr.release() } }
                      }
                      val out = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.JPEG, 84, out)
                      bmp.recycle()
                      out.toByteArray().also { thumbs.put(key, it) }
                  }
                  return WebResourceResponse("image/jpeg", null, 200, "OK",
                      mapOf("Cache-Control" to "max-age=86400"), ByteArrayInputStream(bytes))
              }

              private fun notFound() =
                  WebResourceResponse("text/plain", "utf-8", 404, "Not Found", emptyMap(), ByteArrayInputStream(ByteArray(0)))
          }

          class LimitedInputStream(private val inner: InputStream, private var left: Long) : InputStream() {
              override fun read(): Int {
                  if (left <= 0) return -1
                  val r = inner.read()
                  if (r >= 0) left--
                  return r
              }

              override fun read(b: ByteArray, off: Int, len: Int): Int {
                  if (left <= 0) return -1
                  val n = inner.read(b, off, minOf(len.toLong(), left).toInt())
                  if (n > 0) left -= n
                  return n
              }

              override fun available(): Int = minOf(inner.available().toLong(), left).toInt()
              override fun close() = inner.close()
          }
          NXEOF
          cat > app/src/main/java/com/nexora/pro/MainActivity.kt <<'NXEOF'
          package com.nexora.pro

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceResponse
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import com.google.android.gms.auth.api.identity.AuthorizationRequest
          import com.google.android.gms.auth.api.identity.AuthorizationResult
          import com.google.android.gms.auth.api.identity.Identity
          import com.google.android.gms.common.api.Scope
          import org.json.JSONObject

          class MainActivity : Activity() {

              companion object {
                  const val HOST = "appassets.androidplatform.net"
                  const val START_URL = "https://$HOST/assets/index.html"
                  private const val REQ_FILES = 10
                  private const val REQ_MEDIA = 11
                  private const val REQ_NOTIF = 12
                  private const val REQ_GOOGLE = 13
                  private const val REQ_REC = 14
                  private const val DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file"
                  private const val PERM_VISUAL_SELECTED = "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
              }

              private lateinit var root: FrameLayout
              private lateinit var webView: WebView
              private lateinit var server: LocalServer
              private lateinit var files: FileActions
              private lateinit var nat: NativeAudioPlayer

              @Volatile private var boostLevel = 100
              @Volatile private var boostKeys = true
              private var pipPlaying = true
              private var pipW = 16
              private var pipH = 9
              private val pipReceiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(c: android.content.Context?, i: Intent?) {
                      val a = i?.getStringExtra("a") ?: return
                      js("window.nxPipAction && nxPipAction('$a')")
                  }
              }

              /** Ventana flotante con botones propios de Nexora: −10 s, reproducir/pausa y +10 s. */
              private fun pipParams(w: Int, h: Int): android.app.PictureInPictureParams {
                  var rw = if (w > 0) w else 16; var rh = if (h > 0) h else 9
                  val r = rw.toDouble() / rh
                  if (r > 2.39) { rw = 239; rh = 100 } else if (r < 1 / 2.39) { rw = 100; rh = 239 }
                  fun act(icon: Int, label: String, a: String, code: Int): android.app.RemoteAction {
                      val pi = android.app.PendingIntent.getBroadcast(this, code,
                          Intent("com.nexora.pro.PIP").setPackage(packageName).putExtra("a", a),
                          android.app.PendingIntent.FLAG_IMMUTABLE or android.app.PendingIntent.FLAG_UPDATE_CURRENT)
                      return android.app.RemoteAction(android.graphics.drawable.Icon.createWithResource(this, icon), label, label, pi)
                  }
                  val actions = listOf(
                      act(R.drawable.ic_n_rew10, "Atrás 10 s", "rew", 31),
                      if (pipPlaying) act(R.drawable.ic_n_pause, "Pausar", "toggle", 32) else act(R.drawable.ic_n_play, "Reproducir", "toggle", 33),
                      act(R.drawable.ic_n_fwd10, "Adelante 10 s", "fwd", 34))
                  return android.app.PictureInPictureParams.Builder()
                      .setAspectRatio(android.util.Rational(rw, rh))
                      .setActions(actions).build()
              }

              private var pendingExternal: String? = null
              private var pageReady = false
              private var resumedNow = false
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private var customView: View? = null
              private var customViewCallback: WebChromeClient.CustomViewCallback? = null

              @SuppressLint("SetJavaScriptEnabled", "JavascriptInterface")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  server = LocalServer(applicationContext)
                  files = FileActions(this) { js(it) }
                  nat = NativeAudioPlayer(applicationContext) { ev, v -> js("window.nxNA && nxNA('$ev', $v)") }
                  nat.vizOut = { s -> js("window.nxViz && nxViz('$s')") }

                  val bg = Color.parseColor("#120F2A")
                  root = FrameLayout(this).apply { setBackgroundColor(bg) }
                  webView = WebView(this).apply {
                      setBackgroundColor(bg)
                      layoutParams = FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  }
                  root.addView(webView)
                  setContentView(root)
                  volumeControlStream = android.media.AudioManager.STREAM_MUSIC

                  with(webView.settings) {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = false
                      allowContentAccess = false
                      cacheMode = WebSettings.LOAD_DEFAULT
                      // La música y los videos llegan desde el servidor local 127.0.0.1
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      setSupportZoom(false)
                      builtInZoomControls = false
                      displayZoomControls = false
                      textZoom = 100
                  }
                  // Evita que Android detenga la música cuando la app está en segundo plano.
                  webView.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false)
                  webView.addJavascriptInterface(Bridge(), "Nexora")

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldInterceptRequest(view: WebView, request: WebResourceRequest): WebResourceResponse? =
                          if (request.url.host == HOST) server.handle(request) else null

                      override fun onPageFinished(view: WebView, url: String?) {
                          pageReady = true
                          pendingExternal?.let { j -> pendingExternal = null; js("window.nxOpenExternal && nxOpenExternal($j)") }
                          pendingWidget?.let { a -> pendingWidget = null; js("window.nxWidget && nxWidget(${JSONObject.quote(a)})") }
                      }

                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          if (request.url.host == HOST) return false
                          runCatching { startActivity(Intent(Intent.ACTION_VIEW, request.url)) }
                          return true
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView, callback: ValueCallback<Array<Uri>>, params: FileChooserParams
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = callback
                          val wantsImage = params.acceptTypes?.any { it.startsWith("image") } == true
                          val wantsJson = params.acceptTypes?.any { it.contains("json") } == true
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              if (wantsImage) type = "image/*"
                              else if (wantsJson) type = "*/*"
                              else {
                                  type = "*/*"
                                  putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("audio/*", "video/*"))
                                  putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                              }
                          }
                          return try {
                              @Suppress("DEPRECATION")
                              startActivityForResult(Intent.createChooser(intent, "Elegir archivos"), REQ_FILES)
                              true
                          } catch (e: Exception) {
                              filePathCallback = null
                              false
                          }
                      }

                      override fun onShowCustomView(view: View, callback: CustomViewCallback) {
                          if (customView != null) { callback.onCustomViewHidden(); return }
                          customView = view
                          customViewCallback = callback
                          root.addView(view, FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
                          webView.visibility = View.GONE
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                          window.insetsController?.let {
                              it.hide(WindowInsets.Type.systemBars())
                              it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          }
                      }

                      override fun onHideCustomView() {
                          val v = customView ?: return
                          root.removeView(v)
                          customView = null
                          webView.visibility = View.VISIBLE
                          requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                          window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                          window.insetsController?.show(WindowInsets.Type.systemBars())
                          customViewCallback?.onCustomViewHidden()
                          customViewCallback = null
                      }
                  }

                  val pf = android.content.IntentFilter("com.nexora.pro.PIP")
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(pipReceiver, pf, android.content.Context.RECEIVER_NOT_EXPORTED)
                  else registerReceiver(pipReceiver, pf)

                  Updater.listener = { state, pct -> js("window.nxUpd && nxUpd('$state', $pct)") }

                  // Botones de la notificación y la pantalla de bloqueo -> reproductor.
                  PlaybackService.listener = { action ->
                      js("window.nxRemote && nxRemote(${JSONObject.quote(action)})")
                  }

                  if (savedInstanceState != null) webView.restoreState(savedInstanceState)
                  else webView.loadUrl(START_URL)
                  handleExternal(intent)
                  handleWidget(intent)
                  NxWidget.refresh(applicationContext)
                  runCatching { getSystemService(android.media.AudioManager::class.java).registerAudioDeviceCallback(outCb, android.os.Handler(android.os.Looper.getMainLooper())) }
              }

              private fun js(code: String) = runOnUiThread { webView.evaluateJavascript(code, null) }

              // ---- Inicio de sesión con Google (permiso para Drive) ----
              private fun googleFail(msg: String?) =
                  js("window.nxOnGoogle && nxOnGoogle(null, ${JSONObject.quote(msg ?: "error")})")

              private fun googleDone(r: AuthorizationResult) {
                  val tok = r.accessToken
                  when {
                      tok == null -> googleFail("error")
                      !r.grantedScopes.contains(DRIVE_SCOPE) -> googleFail("perm")
                      else -> js("window.nxOnGoogle && nxOnGoogle(${JSONObject.quote(tok)}, null)")
                  }
              }

              private fun googleAuth() {
                  val req = AuthorizationRequest.builder()
                      .setRequestedScopes(listOf(Scope(DRIVE_SCOPE), Scope("email"), Scope("profile")))
                      .build()
                  Identity.getAuthorizationClient(this).authorize(req)
                      .addOnSuccessListener { r ->
                          val pi = r.pendingIntent
                          if (r.hasResolution() && pi != null) {
                              runCatching { startIntentSenderForResult(pi.intentSender, REQ_GOOGLE, null, 0, 0, 0) }
                                  .onFailure { googleFail(it.message) }
                          } else googleDone(r)
                      }
                      .addOnFailureListener { e -> googleFail(e.message) }
              }

              private fun googleResult(resultCode: Int, data: Intent?) {
                  // Aunque Android diga "cancelado", intentamos leer el resultado: a veces sí trae el permiso.
                  val r = runCatching { Identity.getAuthorizationClient(this).getAuthorizationResultFromIntent(data) }
                  r.getOrNull()?.let { googleDone(it); return }
                  val why = r.exceptionOrNull()?.message ?: "sin detalle"
                  googleFail(if (resultCode == RESULT_OK) why else "cancel:$why")
              }

              private fun granted(p: String) = checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun permState(): JSONObject {
                  val audio: Boolean
                  val video: Boolean
                  if (Build.VERSION.SDK_INT >= 33) {
                      audio = granted(Manifest.permission.READ_MEDIA_AUDIO)
                      video = granted(Manifest.permission.READ_MEDIA_VIDEO) ||
                          (Build.VERSION.SDK_INT >= 34 && granted(PERM_VISUAL_SELECTED))
                  } else {
                      audio = granted(Manifest.permission.READ_EXTERNAL_STORAGE)
                      video = audio
                  }
                  val notif = Build.VERSION.SDK_INT < 33 || granted(Manifest.permission.POST_NOTIFICATIONS)
                  return JSONObject().put("audio", audio).put("video", video).put("notif", notif)
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun googleSignIn() = runOnUiThread { googleAuth() }

                  @JavascriptInterface
                  fun hasPermissions(): String = permState().toString()

                  @JavascriptInterface
                  fun requestPermissions() = runOnUiThread {
                      val perms = if (Build.VERSION.SDK_INT >= 33) {
                          val list = mutableListOf(Manifest.permission.READ_MEDIA_AUDIO, Manifest.permission.READ_MEDIA_VIDEO)
                          if (Build.VERSION.SDK_INT >= 34) list.add(PERM_VISUAL_SELECTED)
                          list.toTypedArray()
                      } else arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                      requestPermissions(perms, REQ_MEDIA)
                  }

                  @JavascriptInterface
                  fun requestNotifications() = runOnUiThread {
                      if (Build.VERSION.SDK_INT >= 33 && !granted(Manifest.permission.POST_NOTIFICATIONS))
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), REQ_NOTIF)
                      else js("window.nxOnNotif && nxOnNotif(true)")
                  }

                  @JavascriptInterface
                  fun scan() {
                      Thread {
                          val json = try { MediaScanner.scan(applicationContext) } catch (e: Exception) { "[]" }
                          js("window.nxOnScan && nxOnScan($json)")
                      }.start()
                  }

                  @JavascriptInterface
                  fun openAppSettings() = runOnUiThread {
                      startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                          Uri.fromParts("package", packageName, null)))
                  }

                  @JavascriptInterface
                  fun mediaUpdate(json: String) = runOnUiThread {
                      runCatching { PlaybackService.update(this@MainActivity, JSONObject(json)) }
                  }

                  @JavascriptInterface
                  fun mediaBase(): String = MediaHttpServer.base(applicationContext)

                  @JavascriptInterface
                  fun outputType(): String = outType()

                  @JavascriptInterface
                  fun setWidgetStr(tap: String) { NxWidget.setTap(applicationContext, tap) }

                  /** Zoom con dos dedos: apagado por defecto, se activa en Ajustes → Más. */
                  @JavascriptInterface
                  fun setZoom(on: Boolean) = runOnUiThread {
                      webView.settings.setSupportZoom(on)
                      webView.settings.builtInZoomControls = on
                      webView.settings.displayZoomControls = false
                      if (!on) runCatching { while (webView.zoomOut()) {} }
                  }

                  /** Usa una canción del teléfono como tono; si falta el permiso, abre la pantalla para darlo. */
                  @JavascriptInterface
                  fun setRingtone(id: String, kind: String) = runOnUiThread {
                      val n = id.toLongOrNull() ?: return@runOnUiThread
                      if (!android.provider.Settings.System.canWrite(this@MainActivity)) {
                          pendingTone = n to kind
                          js("window.nxOnTone && nxOnTone('perm', false)")
                          runCatching { startActivity(Intent(android.provider.Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:" + packageName))) }
                      } else applyTone(n, kind)
                  }

                  /** Pasa a la versión oficial: abre Nexora en Play Store y pide quitar esta versión de GitHub (firma distinta). */
                  @JavascriptInterface
                  fun migratePlay() = runOnUiThread {
                      val id = packageName
                      runCatching {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + id)).setPackage("com.android.vending").addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      }.onFailure {
                          runCatching { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=" + id)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                      }
                      android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({
                          runCatching { startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:" + id)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)) }
                      }, 1200)
                  }

                  /** Desde dónde se instaló la app ("com.android.vending" = Google Play). */
                  @JavascriptInterface
                  fun installer(): String = runCatching {
                      if (Build.VERSION.SDK_INT >= 30) packageManager.getInstallSourceInfo(packageName).installingPackageName ?: ""
                      else @Suppress("DEPRECATION") (packageManager.getInstallerPackageName(packageName) ?: "")
                  }.getOrDefault("")

                  /** Ventana oficial de Google Play para calificar; si no aparece y se pidió desde Ajustes, abre la ficha. */
                  @JavascriptInterface
                  fun askReview(fromSettings: Boolean) = runOnUiThread {
                      val store = "https://play.google.com/store/apps/details?id=" + packageName
                      runCatching {
                          val m = com.google.android.play.core.review.ReviewManagerFactory.create(this@MainActivity)
                          m.requestReviewFlow().addOnCompleteListener { t ->
                              if (t.isSuccessful) m.launchReviewFlow(this@MainActivity, t.result)
                              else if (fromSettings) runCatching { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(store))) }
                          }
                      }.onFailure { if (fromSettings) runCatching { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(store))) } }
                  }

                  @JavascriptInterface
                  fun setOrientation(mode: String) = runOnUiThread {
                      requestedOrientation = when (mode) {
                          "landscape" -> ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          "portrait" -> ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                          else -> ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                      }
                      window.insetsController?.let {
                          if (mode == "landscape") {
                              it.hide(WindowInsets.Type.systemBars())
                              it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          } else it.show(WindowInsets.Type.systemBars())
                      }
                  }

                  @JavascriptInterface
                  fun keepScreenOn(on: Boolean) = runOnUiThread {
                      if (on) window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      else window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }

                  @JavascriptInterface
                  fun share(json: String) = runOnUiThread { files.share(json) }

                  @JavascriptInterface
                  fun trash(json: String) = runOnUiThread { files.trash(json) }

                  @JavascriptInterface
                  fun rename(type: String, id: Long, name: String) = runOnUiThread { files.rename(type, id, name) }

                  @JavascriptInterface
