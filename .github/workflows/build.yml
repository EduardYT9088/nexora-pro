          cat > app/src/main/java/com/nexora/pro/NewMedia.kt <<'NXEOF'
          package com.nexora.pro

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.job.JobInfo
          import android.app.job.JobParameters
          import android.app.job.JobScheduler
          import android.app.job.JobService
          import android.app.Service
          import android.content.pm.ServiceInfo
          import android.database.ContentObserver
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.ContentUris
          import android.graphics.Bitmap
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import android.util.Size
          import org.json.JSONObject

          /** Indica si Nexora Pro está abierta: en ese caso no se avisa, porque la persona ya la está viendo. */
          object NxState { @Volatile var foreground = false }

          /**
           * Avisos de música y video nuevos. Android despierta este trabajo cuando cambia la biblioteca de medios
           * (por ejemplo, al terminar una descarga de Download Nexora), aunque Nexora Pro esté cerrada.
           * Solo se lee el título y la fecha de lo nuevo; no se guarda ni se envía nada.
           */
          object NewMedia {
              private const val JOB_ID = 7421
              private const val NOTIF_ID = 7421
              private const val CHANNEL = "nexora_new_files"

              private fun prefs(c: Context) = c.getSharedPreferences("nexora_new", Context.MODE_PRIVATE)

              fun configure(c: Context, on: Boolean, strings: String, showNames: Boolean) {
                  prefs(c).edit().putBoolean("on", on).putString("strings", strings).putBoolean("names", showNames).apply()
              }

              private fun maxId(c: Context, uri: android.net.Uri): Long {
                  var m = -1L
                  runCatching {
                      val args = android.os.Bundle().apply {
                          putInt(android.content.ContentResolver.QUERY_ARG_LIMIT, 1)
                          putStringArray(android.content.ContentResolver.QUERY_ARG_SORT_COLUMNS, arrayOf("_id"))
                          putInt(android.content.ContentResolver.QUERY_ARG_SORT_DIRECTION, android.content.ContentResolver.QUERY_SORT_DIRECTION_DESCENDING)
                      }
                      c.contentResolver.query(uri, arrayOf("_id"), args, null)?.use { q -> m = if (q.moveToFirst()) q.getLong(0) else 0L }
                  }
                  return m
              }

              fun setWatch(c: Context, on: Boolean) { prefs(c).edit().putBoolean("watch", on).apply() }

              /** Respaldo: revisa cada 15 minutos por si el teléfono canceló el aviso inmediato. Sobrevive a reinicios. */
              fun periodic(c: Context) {
                  runCatching {
                      val js = c.getSystemService(JobScheduler::class.java)
                      if (js.getPendingJob(JOB_ID + 1) != null) return
                      js.schedule(
                          JobInfo.Builder(JOB_ID + 1, ComponentName(c, NewMediaJobService::class.java))
                              .setPeriodic(15 * 60 * 1000L).setPersisted(true).build()
                      )
                  }
              }

              /** Vigilante con notificación fija: mantiene la app viva para avisar al instante aunque esté cerrada. */
              fun watch(c: Context) {
                  val p = prefs(c)
                  val want = p.getBoolean("on", true) && p.getBoolean("watch", true)
                  runCatching {
                      val i = Intent(c, NewMediaWatchService::class.java)
                      if (want) c.startForegroundService(i) else c.stopService(i)
                  }
              }

              fun watchNotif(c: Context): Notification {
                  val nm = c.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("nexora_watch", str(c, "watchCh", "Avisos en segundo plano"), NotificationManager.IMPORTANCE_MIN).apply { setShowBadge(false) })
                  val open = PendingIntent.getActivity(
                      c, 2, Intent(c, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return Notification.Builder(c, "nexora_watch")
                      .setSmallIcon(R.drawable.ic_stat_nexora)
                      .setContentTitle(str(c, "title", "Nexora Pro"))
                      .setContentText(str(c, "watch", "Toca para abrir tu música"))
                      .setContentIntent(open)
                      .setOngoing(true)
                      .build()
              }

              /** Lo que ya existe cuenta como "visto": solo se avisa de los archivos que lleguen después. */
              fun touch(c: Context) {
                  val a = maxId(c, MediaStore.Audio.Media.EXTERNAL_CONTENT_URI)
                  val v = maxId(c, MediaStore.Video.Media.EXTERNAL_CONTENT_URI)
                  // Sin permiso de lectura no se guarda nada (así no avisaría de toda la biblioteca más tarde)
                  if (a >= 0 && v >= 0) prefs(c).edit().putLong("maxA", a).putLong("maxV", v).apply()
              }

              fun schedule(c: Context) {
                  runCatching {
                      if (!prefs(c).contains("maxA")) touch(c)
                      val js = c.getSystemService(JobScheduler::class.java)
                      val b = JobInfo.Builder(JOB_ID, ComponentName(c, NewMediaJobService::class.java))
                          .addTriggerContentUri(JobInfo.TriggerContentUri(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, JobInfo.TriggerContentUri.FLAG_NOTIFY_FOR_DESCENDANTS))
                          .addTriggerContentUri(JobInfo.TriggerContentUri(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, JobInfo.TriggerContentUri.FLAG_NOTIFY_FOR_DESCENDANTS))
                          .setTriggerContentUpdateDelay(1500)
                          .setTriggerContentMaxDelay(6000)
                      js.schedule(b.build())
                  }
              }

              @Synchronized fun check(c: Context) {
                  val p = prefs(c)
                  if (!p.contains("maxA")) { touch(c); return }
                  if (!p.getBoolean("on", true)) { touch(c); return }
                  val seenA = p.getLong("maxA", 0L); val seenV = p.getLong("maxV", 0L)

                  var na = 0; var nv = 0; var nameA = ""; var nameV = ""; var newA = seenA; var newV = seenV; var idA = 0L; var idV = 0L
                  runCatching {
                      c.contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          arrayOf("_id", MediaStore.Audio.Media.TITLE, MediaStore.Audio.Media.IS_RINGTONE, MediaStore.Audio.Media.IS_NOTIFICATION, MediaStore.Audio.Media.IS_ALARM),
                          "_id > ?", arrayOf(seenA.toString()), "_id DESC"
                      )?.use { q ->
                          while (q.moveToNext()) {
                              newA = maxOf(newA, q.getLong(0))
                              if (q.getInt(2) != 0 || q.getInt(3) != 0 || q.getInt(4) != 0) continue
                              na++; if (nameA.isEmpty()) { nameA = q.getString(1) ?: ""; idA = q.getLong(0) }
                          }
                      }
                  }
                  runCatching {
                      c.contentResolver.query(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                          arrayOf("_id", MediaStore.Video.Media.TITLE),
                          "_id > ?", arrayOf(seenV.toString()), "_id DESC"
                      )?.use { q ->
                          while (q.moveToNext()) { newV = maxOf(newV, q.getLong(0)); nv++; if (nameV.isEmpty()) { nameV = q.getString(1) ?: ""; idV = q.getLong(0) } }
                      }
                  }
                  p.edit().putLong("maxA", newA).putLong("maxV", newV).apply()
                  if (na + nv == 0) return

                  val names = p.getBoolean("names", true)
                  val text = when {
                      nv == 0 && na == 1 -> if (names && nameA.isNotBlank()) str(c, "aOne", "Se añadió nueva música: {name}").replace("{name}", nameA) else str(c, "aOneG", "Se añadió nueva música")
                      nv == 0 -> str(c, "aMany", "Se añadieron {n} canciones nuevas").replace("{n}", na.toString())
                      na == 0 && nv == 1 -> if (names && nameV.isNotBlank()) str(c, "vOne", "Se añadió un video nuevo: {name}").replace("{name}", nameV) else str(c, "vOneG", "Se añadió un video nuevo")
                      na == 0 -> str(c, "vMany", "Se añadieron {n} videos nuevos").replace("{n}", nv.toString())
                      else -> str(c, "mix", "Se añadieron {n} archivos nuevos a Nexora").replace("{n}", (na + nv).toString())
                  }
                  // Con un solo archivo nuevo: miniatura y, al tocar, se reproduce directamente.
                  var uri: Uri? = null; var mime = ""; var title = ""
                  if (nv == 0 && na == 1 && idA > 0) { uri = ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, idA); mime = "audio/*"; title = nameA }
                  else if (na == 0 && nv == 1 && idV > 0) { uri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, idV); mime = "video/*"; title = nameV }
                  post(c, text, uri, mime, title)
              }

              private fun str(c: Context, k: String, d: String): String {
                  val s = runCatching { JSONObject(prefs(c).getString("strings", "{}") ?: "{}") }.getOrDefault(JSONObject())
                  return s.optString(k, d)
              }

              /** Notificación de prueba desde Ajustes → Notificaciones. */
              fun test(c: Context) = post(c, str(c, "aOne", "Se añadió nueva música: {name}").replace("{name}", "Nexora Pro"), null, "", "")

              private fun post(c: Context, text: String, uri: Uri?, mime: String, title: String) {
                  if (Build.VERSION.SDK_INT >= 33 && c.checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) return
                  val nm = c.getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel(CHANNEL, str(c, "channel", "Nuevos archivos"), NotificationManager.IMPORTANCE_DEFAULT))
                  val it = Intent(c, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  if (uri != null) it.setAction(Intent.ACTION_VIEW).setDataAndType(uri, mime).putExtra("nexora_title", title)
                  val open = PendingIntent.getActivity(c, 0, it, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  var bmp: Bitmap? = null
                  if (uri != null && Build.VERSION.SDK_INT >= 29) bmp = runCatching { c.contentResolver.loadThumbnail(uri, Size(640, 640), null) }.getOrNull()
                  val tap = if (uri != null) str(c, "tap", "Toca para reproducirlo ahora") else ""
                  val body = if (tap.isNotEmpty()) text + "\n" + tap else text
                  val b = Notification.Builder(c, CHANNEL)
                      .setSmallIcon(R.drawable.ic_stat_nexora)
                      .setContentTitle(str(c, "title", "Nexora Pro"))
                      .setContentText(text)
                      .setContentIntent(open)
                      .setAutoCancel(true)
                  if (bmp != null) b.setLargeIcon(bmp).setStyle(Notification.BigPictureStyle().bigPicture(bmp).bigLargeIcon(null as Bitmap?).setSummaryText(body))
                  else b.setStyle(Notification.BigTextStyle().bigText(body))
                  nm.notify(NOTIF_ID, b.build())
              }
          }

          class NewMediaJobService : JobService() {
              override fun onStartJob(params: JobParameters): Boolean {
                  Thread {
                      runCatching { NewMedia.check(applicationContext) }
                      NewMedia.schedule(applicationContext)
                      runCatching { NewMedia.watch(applicationContext) }
                      jobFinished(params, false)
                  }.start()
                  return true
              }
              override fun onStopJob(params: JobParameters): Boolean = false
          }

          class NewMediaWatchService : Service() {
              private val h = Handler(Looper.getMainLooper())
              private val run = Runnable { Thread { runCatching { NewMedia.check(applicationContext) } }.start() }
              private val obs = object : ContentObserver(h) {
                  override fun onChange(selfChange: Boolean) { h.removeCallbacks(run); h.postDelayed(run, 2500) }
              }
              override fun onBind(i: Intent?): IBinder? = null
              override fun onCreate() {
                  super.onCreate()
                  runCatching {
                      contentResolver.registerContentObserver(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, true, obs)
                      contentResolver.registerContentObserver(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, true, obs)
                  }
              }
              override fun onStartCommand(i: Intent?, flags: Int, startId: Int): Int {
                  runCatching {
                      val n = NewMedia.watchNotif(this)
                      if (Build.VERSION.SDK_INT >= 34) startForeground(7422, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                      else startForeground(7422, n)
                  }.onFailure { stopSelf() }
                  h.removeCallbacks(run); h.postDelayed(run, 2500)
                  return START_STICKY
              }
              override fun onDestroy() {
                  runCatching { contentResolver.unregisterContentObserver(obs) }
                  h.removeCallbacks(run)
                  super.onDestroy()
              }
          }
