      - name: Versión automática y novedades
        id: ver
        env:
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os
          run = int(os.environ['RUN'])
          ver = '1.7.' + str(run)
          code = 20000 + run
          lines = []
          try:
              lines = [l.strip() for l in open('novedades.md', encoding='utf-8-sig').read().splitlines()]
          except Exception:
              pass
          opcional = any(l.lower().startswith('[opcional]') for l in lines)
          import re as _re
          for l in lines:
              m = _re.match('^(?:versi[oó]n|version)[ :]*[vV]?([0-9]+[.][0-9]+(?:[.][0-9]+)?)', l, _re.I)
              if m:
                  ver = m.group(1)
                  break
          nov = [l[1:].strip() for l in lines if l.startswith('-') and l[1:].strip()]
          g = open('proyecto/app/build.gradle.kts', encoding='utf-8').read()
          import re
          g = re.sub('versionCode = [0-9]+', 'versionCode = ' + str(code), g)
          g = re.sub('versionName = "[^"]*"', 'versionName = "' + ver + '"', g)
          open('proyecto/app/build.gradle.kts', 'w', encoding='utf-8').write(g)
          info = {'version': ver, 'code': code, 'obligatoria': not opcional, 'novedades': nov,
                  'apk': 'https://github.com/' + os.environ['REPO'] + '/releases/latest/download/NexoraPro.apk'}
          json.dump(info, open('version-release.json', 'w', encoding='utf-8'), ensure_ascii=False)
          NL = chr(10)
          notes = 'Nexora Pro v' + ver + NL + NL + ''.join('- ' + x + NL for x in nov) + NL + 'Descarga NexoraPro.apk e instálalo en tu teléfono.'
          open('release-notes.md', 'w', encoding='utf-8').write(notes)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('version=' + ver + chr(10))
          print('Versión', ver, 'código', code, 'obligatoria', not opcional)
          PY

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp proyecto/app/build/outputs/apk/release/app-release.apk NexoraPro.apk

      - name: Guardar APK en la compilación
        uses: actions/upload-artifact@v4
        with:
          name: NexoraPro-apk
          path: NexoraPro.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          TAG="v$VER"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then TAG="v$VER-build${{ github.run_number }}"; fi
          cp version-release.json version.json
          if [ "${{ github.ref_name }}" = "main" ]; then
            gh release create "$TAG" NexoraPro.apk version.json \
              --repo "$REPO" \
              --target "${{ github.sha }}" \
              --title "Nexora Pro v$VER" \
              --notes-file release-notes.md \
              --latest
            echo "REL_TAG=$TAG" >> "$GITHUB_ENV"
          else
            # Versión de prueba (otra rama): se publica como pre-lanzamiento y NO llega como actualización a los usuarios
            gh release create "prueba-$VER-build${{ github.run_number }}" NexoraPro.apk \
              --repo "$REPO" \
              --target "${{ github.sha }}" \
              --title "PRUEBA Nexora Pro v$VER (no es la versión oficial)" \
              --notes-file release-notes.md \
              --prerelease
            echo "REL_TAG=prueba-$VER-build${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      # ---------- Versión para Google Play (.aab) ----------
      # Va después de publicar el APK: si algo de Play falla, la versión de GitHub ya salió igual.
      - name: Preparar versión para Google Play
        id: play
        continue-on-error: true
        shell: bash
        run: |
          set -e
          python3 - <<'PYEOF'
          import re, pathlib
          P = pathlib.Path('proyecto')
          def sub(f, old, new):
              p = P / f; t = p.read_text(encoding='utf-8')
              if old not in t: raise SystemExit('No encontrado en ' + f + ': ' + old[:60])
              p.write_text(t.replace(old, new, 1), encoding='utf-8')
          # Play exige apuntar a Android 16 (API 36)
          sub('build.gradle.kts', 'version "8.5.2"', 'version "8.9.1"')
          sub('build.gradle.kts', 'version "1.9.24"', 'version "2.0.21"')
          sub('app/build.gradle.kts', 'compileSdk = 34', 'compileSdk = 36')
          sub('app/build.gradle.kts', 'targetSdk = 34', 'targetSdk = 36')
          # Permisos que Play no acepta en un reproductor: autoactualización, alarma exacta y servicio especial
          m = P / 'app/src/main/AndroidManifest.xml'; t = m.read_text(encoding='utf-8')
          for perm in ['USE_EXACT_ALARM', 'SCHEDULE_EXACT_ALARM', 'REQUEST_INSTALL_PACKAGES', 'REQUEST_DELETE_PACKAGES', 'FOREGROUND_SERVICE_SPECIAL_USE']:
              t = re.sub(r'\s*<uses-permission android:name="android\.permission\.' + perm + r'"[^>]*/>', '', t)
          t = re.sub(r'\s*<service\s+android:name="\.NewMediaWatchService".*?</service>', '', t, flags=re.S)
          # Android 15: nada se arranca desde BOOT_COMPLETED. Tras reiniciar, el trabajo periódico (persistente) reprograma los avisos.
          t = t.replace('                <action android:name="android.intent.action.BOOT_COMPLETED" />\n', '')
          assert 'BOOT_COMPLETED"' not in t.replace('permission.RECEIVE_BOOT_COMPLETED', '')
          m.write_text(t, encoding='utf-8')
          k = 'app/src/main/java/com/nexora/pro/'
          sub(k + 'NewMedia.kt', '            NewMedia.schedule(applicationContext)\n', '            NewMedia.schedule(applicationContext)\n            runCatching { MusicTime.schedule(applicationContext) }\n')
          # En Play las actualizaciones las entrega la tienda
          sub(k + 'MainActivity.kt', 'fun checkUpdate(repo: String) {', 'fun checkUpdate(repo: String) {\n        if (repo.isNotEmpty()) return')
          # Sin vigilante fijo: los avisos de archivos nuevos usan los trabajos de Android
          # Sin servicio fijo: ni se arranca desde la app ni desde el reinicio (BOOT_COMPLETED)
          sub(k + 'NewMedia.kt', 'if (want) c.startForegroundService(i) else c.stopService(i)', 'if (want || !want) c.stopService(i)')
          sub(k + 'MusicTime.kt', 'NewMedia.schedule(c); NewMedia.periodic(c); NewMedia.watch(c)', 'NewMedia.schedule(c); NewMedia.periodic(c)')
          # Android 15+ dibuja detrás de las barras: se deja el espacio de la barra de estado, de navegación y del teclado
          # Solo el teclado empuja la vista; la barra de estado y la de navegación las maneja el diseño con --sat/--sab
          sub(k + 'MainActivity.kt', '        setContentView(root)\n', """        setContentView(root)
                  if (Build.VERSION.SDK_INT >= 35) root.setOnApplyWindowInsetsListener { v, ins ->
                      val bars = ins.getInsets(android.view.WindowInsets.Type.systemBars() or android.view.WindowInsets.Type.displayCutout())
                      val ime = ins.getInsets(android.view.WindowInsets.Type.ime())
                      val kb = ime.bottom > bars.bottom
                      v.setPadding(bars.left, 0, bars.right, if (kb) ime.bottom else 0)
                      val d = resources.displayMetrics.density
                      NxInsets.css = "document.documentElement.style.setProperty('--sat','" + (bars.top / d) + "px');" +
                          "document.documentElement.style.setProperty('--sab','" + (if (kb) 0f else bars.bottom / d) + "px');"
                      webView.evaluateJavascript(NxInsets.css, null)
                      ins
                  }
          """)
          sub(k + 'MainActivity.kt', '        pageReady = true\n', '        pageReady = true\n        if (NxInsets.css.isNotEmpty()) view.evaluateJavascript(NxInsets.css, null)\n')
          m = P / (k + 'MainActivity.kt'); m.write_text(m.read_text(encoding='utf-8') + '\nobject NxInsets { var css = "" }\n', encoding='utf-8')
          print('Proyecto preparado para Google Play')
          PYEOF

      - name: Instalar Gradle para Google Play
        if: steps.play.outcome == 'success'
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar AAB para Google Play
        id: aab
        if: steps.play.outcome == 'success'
        continue-on-error: true
        working-directory: proyecto
        run: gradle clean bundleRelease --no-daemon --stacktrace

      - name: Subir AAB para Google Play
        if: steps.aab.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp proyecto/app/build/outputs/bundle/release/app-release.aab NexoraPro-Play.aab
          gh release upload "$REL_TAG" NexoraPro-Play.aab --repo "$REPO" --clobber
