                  p.setOnCompletionListener { if (mp === it) { main.removeCallbacks(ticker); emit("ended", 0.0) } }
                  p.setOnErrorListener { mpx, _, _ -> if (mp === mpx) emit("error", 0.0); true }
                  p.setOnSeekCompleteListener { if (mp === it) emit("seeked", it.currentPosition / 1000.0) }
                  try {
                      p.setDataSource(ctx, uri)
                      p.prepareAsync()
                  } catch (e: Exception) {
                      emit("error", 0.0)
                  }
              }

              private fun start() {
                  val p = mp ?: return
                  try {
                      p.start()
                      if (rate != 1f) p.playbackParams = p.playbackParams.setSpeed(rate)
                  } catch (e: Exception) { }
                  main.removeCallbacks(ticker)
                  main.post(ticker)
              }

              fun play() { wantPlay = true; if (prepared) start() }

              fun pause() {
                  wantPlay = false
                  val p = mp ?: return
                  main.removeCallbacks(ticker)
                  if (prepared) {
                      runCatching { if (p.isPlaying) p.pause() }
                      emit("time", p.currentPosition / 1000.0)
                  }
              }

              fun seek(ms: Long) {
                  val p = mp ?: return
                  if (prepared) runCatching { p.seekTo(ms.toInt()) } else pendingSeek = ms
              }

              fun setRate(r: Double) {
                  rate = r.toFloat()
                  val p = mp ?: return
                  if (prepared && p.isPlaying) runCatching { p.playbackParams = p.playbackParams.setSpeed(rate) }
              }

              fun setVolume(v: Double) {
                  vol = v.toFloat().coerceIn(0f, 1f)
                  runCatching { mp?.setVolume(vol, vol) }
              }

              fun setEq(on: Boolean, gainsJson: String) {
                  eqOn = on
                  runCatching {
                      val a = JSONArray(gainsJson)
                      for (i in 0 until minOf(10, a.length())) eqGains[i] = a.getDouble(i)
                  }
                  applyEffects()
              }

              fun setBoost(level: Int) { boost = level.coerceIn(100, 300); applyEffects() }

              /** Mejoras de sonido: graves, envolvente 3D y claridad (0–100) y normalizar volumen. */
              fun setFx(b: Int, surround: Int, clarity: Int, norm: Boolean) {
                  fxBass = b.coerceIn(0, 100); fxSurround = surround.coerceIn(0, 100)
                  fxClarity = clarity.coerceIn(0, 100); fxNorm = norm
                  applyEffects()
              }

              /** Curva de claridad: realce suave de presencia (3–5 kHz) y brillo (10 kHz+), en dB. */
              private fun clarityAt(hz: Double): Double {
                  val k = fxClarity / 100.0
                  val presence = 3.0 * kotlin.math.exp(-Math.pow(ln(hz / 3500.0) / 0.6, 2.0))
                  val air = 4.0 / (1 + Math.pow(10000.0 / hz, 2.0))
                  return k * (presence + air)
              }

              /** Ganancia (dB) de nuestra curva de 10 bandas para una frecuencia cualquiera. */
              private fun gainAt(hz: Double): Double {
                  if (hz <= freqs[0]) return eqGains[0]
                  if (hz >= freqs[9]) return eqGains[9]
                  for (i in 0 until 9) {
                      if (hz <= freqs[i + 1]) {
                          val t = (ln(hz) - ln(freqs[i])) / (ln(freqs[i + 1]) - ln(freqs[i]))
                          return eqGains[i] + (eqGains[i + 1] - eqGains[i]) * t
                      }
                  }
                  return 0.0
              }

              private fun applyEffects() {
                  val p = mp ?: return
                  if (!prepared) return
                  val sid = p.audioSessionId
                  runCatching {
                      val useEq = eqOn || fxClarity > 0
                      if (eq == null && useEq) eq = Equalizer(0, sid)
                      eq?.let { e ->
                          val range = e.bandLevelRange
                          for (b in 0 until e.numberOfBands) {
                              val hz = e.getCenterFreq(b.toShort()) / 1000.0
                              val db = (if (eqOn) gainAt(hz) else 0.0) + clarityAt(hz)
                              val mb = (db * 100).toInt().coerceIn(range[0].toInt(), range[1].toInt())
                              e.setBandLevel(b.toShort(), mb.toShort())
                          }
                          e.enabled = useEq
                      }
                  }
                  runCatching {
                      if (bass == null && fxBass > 0) bass = BassBoost(0, sid)
                      bass?.let { if (it.strengthSupported) it.setStrength((fxBass * 10).toShort()); it.enabled = fxBass > 0 }
                  }
                  runCatching {
                      if (virt == null && fxSurround > 0) virt = Virtualizer(0, sid)
                      virt?.let { if (it.strengthSupported) it.setStrength((fxSurround * 10).toShort()); it.enabled = fxSurround > 0 }
                  }
                  runCatching {
                      if (dyn == null && fxNorm) {
                          val cfg = DynamicsProcessing.Config.Builder(
                              DynamicsProcessing.VARIANT_FAVOR_FREQUENCY_RESOLUTION, 2,
                              false, 0, true, 1, false, 0, true).build()
                          val d = DynamicsProcessing(0, sid, cfg)
                          // Compresor suave + limitador: iguala canciones muy bajas y muy altas.
                          d.setMbcBandAllChannelsTo(0, DynamicsProcessing.MbcBand(true, 20000f, 10f, 300f, 3f, -26f, 10f, -90f, 1f, 0f, 7f))
                          d.setLimiterAllChannelsTo(DynamicsProcessing.Limiter(true, true, 0, 1f, 60f, 10f, -1f, 0f))
                          dyn = d
                      }
                      dyn?.enabled = fxNorm
                  }
                  runCatching {
                      if (loud == null && boost > 100) loud = LoudnessEnhancer(sid)
                      loud?.let { l ->
                          l.setTargetGain((4000 * log10(boost / 100.0)).toInt())
                          l.enabled = boost > 100
                      }
                  }
              }

              fun release() {
                  main.removeCallbacks(ticker)
                  runCatching { eq?.release() }; eq = null
                  runCatching { loud?.release() }; loud = null
                  runCatching { bass?.release() }; bass = null
                  runCatching { virt?.release() }; virt = null
                  runCatching { dyn?.release() }; dyn = null
                  stopViz()
                  runCatching { mp?.release() }; mp = null
                  prepared = false; wantPlay = false
                  if (vizWanted) main.post { startViz() }
              }
          }
