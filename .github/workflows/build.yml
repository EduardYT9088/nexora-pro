      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp proyecto/app/build/outputs/apk/release/app-release.apk NexoraPro.apk

      - name: Guardar APK en la compilación
        uses: actions/upload-artifact@v4
        with:
          name: NexoraPro-apk
          path: NexoraPro.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.1.${{ github.run_number }}"
          gh release create "$TAG" NexoraPro.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Nexora Pro 1.1.${{ github.run_number }}" \
            --notes "Descarga NexoraPro.apk e instálalo en tu teléfono." \
            --latest
