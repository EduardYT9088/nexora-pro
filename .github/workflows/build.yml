                      val am = getSystemService(android.media.AudioManager::class.java)
                      val cur = am.getStreamVolume(android.media.AudioManager.STREAM_MUSIC)
                      val max = am.getStreamMaxVolume(android.media.AudioManager.STREAM_MUSIC)
                      if (keyCode == android.view.KeyEvent.KEYCODE_VOLUME_UP && cur >= max) {
                          js("window.nxVolumeKey && nxVolumeKey('up')"); return true
                      }
                      if (keyCode == android.view.KeyEvent.KEYCODE_VOLUME_DOWN && boostLevel > 100) {
                          js("window.nxVolumeKey && nxVolumeKey('down')"); return true
                      }
                  }
                  return super.onKeyDown(keyCode, event)
