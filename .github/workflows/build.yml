              fun push(c: Context, t: String, a: String, p: Boolean, bmp: Bitmap?) {
                  val changed = t != title || a != artist || p != playing || bmp !== art
                  title = t; artist = a; playing = p; art = bmp?.let { small(it) }
                  prefs(c).edit().putString("t", t).putString("a", a).apply()
                  if (changed) refresh(c)
